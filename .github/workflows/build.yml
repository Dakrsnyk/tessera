      - name: Promo videos
        id: videos
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.VIDEO == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl ui "$DEVICE" appearance light || true
          mkdir -p videos
          # One scene: the test starts, the recording starts with it and stops when it ends.
          record() {
            LOG="videos/$1.log"
            xcodebuild test-without-building -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
              -destination "id=$DEVICE" -derivedDataPath build/sim -testLanguage fr -testRegion CA \
              -only-testing:ArdaneUITests/PromoVideoUITests/$1 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1 &
            XPID=$!
            until grep -q "$1\]' started" "$LOG" || ! kill -0 $XPID 2>/dev/null; do sleep 0.2; done
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force "videos/$1.mp4" > "videos/$1.rec.log" 2>&1 &
            RPID=$!
            until grep -qE "$1\]' (passed|failed)" "$LOG" || ! kill -0 $XPID 2>/dev/null; do sleep 0.2; done
            kill -INT $RPID 2>/dev/null || true
            wait $RPID 2>/dev/null || true
            wait $XPID 2>/dev/null || true
            ls -lh "videos/$1.mp4" 2>/dev/null || echo "no video for $1"
          }
          for scene in testVideoLaunch testVideoMonQuotidien testVideoPlanning testVideoFitness testVideoNutrition testVideoStudio testVideoFinances testVideoStore testVideoIcons; do
            record $scene
          done
          ls -lh videos
          # The pieces of the videos drawn by the app (scripts/ad_assets.txt): screens, and elements
          # rendered on white then black for difference matting.
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/Ardane.app
          mkdir -p videos/assets
          ARGS=(-AppleLanguages "(fr)" -AppleLocale fr_CA)
          xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${ARGS[@]}" -screenshotScreen home < /dev/null > /dev/null || true
          sleep 8
          ashot() { # file asset [extra launch arguments]
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane < /dev/null 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${ARGS[@]}" -screenshotScreen "marketing-ad-$2" "${@:3}" < /dev/null > /dev/null || true
            sleep 6
            xcrun simctl io "$DEVICE" screenshot --type=png "videos/assets/$1.png" < /dev/null > /dev/null 2>&1 || true
          }
          ASSETS=()
          while IFS= read -r line; do ASSETS+=("$line"); done < <(grep -vE '^[[:space:]]*(#|$)' scripts/ad_assets.txt)
          for line in "${ASSETS[@]}"; do
            read -r name mode <<< "$line"
            if [ "$mode" = "matte" ]; then
              ashot "$name-white" "$name" -marketingScreen white
              ashot "$name-black" "$name" -marketingScreen black
            else
              ashot "$name" "$name"
            fi
          done
          ls videos/assets

      - name: Ad kit
        id: adkit
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && (env.ADKIT == 'true' || env.ADKIT_EN == 'true')
        continue-on-error: true
        timeout-minutes: 60
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl ui "$DEVICE" appearance light || true
          # The French kit goes to adkit/, the English one ([adkit-en]) to adkit-en/. AD_LANG reaches the UITests.
          KIT=adkit; AD_LANG=fr; AD_LOCALE=fr_CA; AD_REGION=CA
          if [ "$ADKIT_EN" = "true" ]; then KIT=adkit-en; AD_LANG=en; AD_LOCALE=en_CA; fi
          export KIT AD_LANG
          mkdir -p $KIT/shots $KIT/screens $KIT/export $KIT/logs
          APP=build/sim/Build/Products/Debug-iphonesimulator/Ardane.app
          # The launch arguments of every capture: French (Canada) or English (Canada), the Saphir style.
          ARGS=(-AppleLanguages "($AD_LANG)" -AppleLocale "$AD_LOCALE" -screenshotStyle sapphire)

          # 1) Real states played by UITests/AdShotsUITests, scene by scene. A loop in the background reads
          # the test log: at each new « ADSHOT <name> » line (the test then holds still about 2 s), it takes
          # a lossless PNG of the simulator's screen. No screen recording.
          watch_shots() { # log
            local log=$1 seen=" " name ended
            while true; do
              ended=0
              [ -f "$log.end" ] && ended=1
              for name in $(grep -aoE "ADSHOT [A-Za-z0-9._-]+" "$log" 2>/dev/null | awk '{print $2}'); do
                case "$seen" in *" $name "*) continue ;; esac
                seen="$seen$name "
                if [ "$ended" = 1 ]; then
                  echo "missed $name (seen after the scene ended)" >> $KIT/missed.txt
                else
                  xcrun simctl io "$DEVICE" screenshot --type=png "$KIT/shots/$name.png" < /dev/null > /dev/null 2>&1 || echo "failed $name" >> $KIT/missed.txt
                fi
              done
              [ "$ended" = 1 ] && break
              sleep 0.15
            done
          }
          rm -rf adkit-results
          mkdir -p adkit-results $KIT/attachments
          run_scene() { # scene [appearance]: AD_APPEARANCE reaches the test as TEST_RUNNER_AD_APPEARANCE
            local scene=$1 look=${2:-}
            local tag=$scene${look:+-$look}
            LOG="$KIT/logs/$tag.log"
            rm -f "$LOG.end"
            : > "$LOG"
            watch_shots "$LOG" &
            WPID=$!
            TEST_RUNNER_AD_APPEARANCE="$look" TEST_RUNNER_AD_LANG="$AD_LANG" xcodebuild test-without-building -project Ardane.xcodeproj -scheme Ardane -configuration Debug               -destination "id=$DEVICE" -derivedDataPath build/sim -testLanguage $AD_LANG -testRegion CA               -resultBundlePath "adkit-results/$tag.xcresult"               -only-testing:ArdaneUITests/AdShotsUITests/$scene ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO >> "$LOG" 2>&1 || true
            touch "$LOG.end"
            wait $WPID 2>/dev/null || true
            rm -f "$LOG.end"
            echo "$tag: $(grep -cE "ADSHOT [A-Za-z0-9._-]+" "$LOG") marker lines"
            # The test's own lossless copy of each moment (attachment « ADSHOT <name> »), in attachments/.
            xcrun xcresulttool export attachments --path "adkit-results/$tag.xcresult" --output-path "adkit-results/$tag" > /dev/null 2>&1 || true
          }
          fresh_install() { # the scenes change the data (a set done, a food added): a fresh install, then the demo data
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane < /dev/null 2>/dev/null || true
            xcrun simctl uninstall "$DEVICE" com.dakrsnyk.ardane || true
            xcrun simctl install "$DEVICE" "$APP"
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${ARGS[@]}" -screenshotScreen home < /dev/null > /dev/null || true
            sleep 8
          }
          for scene in testAdFitnessSession testAdNutritionAdd testAdFinancesPeriods testAdStudio testAdPlanning testAdHabits testAdExerciseLibrary; do
            run_scene "$scene"
          done
          # The main film shows the app in Dark appearance, floating in black: its scenes again, in dark
          # (shots <name>-dark), from the same demo data as the light ones.
          fresh_install
          for scene in testAdFitnessSession testAdNutritionAdd testAdPlanning testAdHabits testAdExerciseLibrary testAdStudio; do
            run_scene "$scene" dark
          done
          python3 - <<'PY' || true
          import glob, json, os, shutil
          for manifest in glob.glob("adkit-results/*/manifest.json"):
              folder = os.path.dirname(manifest)
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or ""
                      if not name.startswith("ADSHOT"):
                          continue
                      name = name.split("_0_")[0][len("ADSHOT"):].strip().replace(" ", "-")
                      shutil.copy(os.path.join(folder, item["exportedFileName"]), os.path.join(os.environ.get("KIT", "adkit"), "attachments", name + ".png"))
          PY
          ls $KIT/shots $KIT/attachments

          # 2) The scenes changed the data (a set done, a food added): a fresh install, then the demo data.
          fresh_install

          # 3) The pieces the app exports itself (App/Core/AdExport.swift): PNG files with true transparency,
          # listed in scripts/ad_export.txt, written into the app's Documents/export, then done.txt.
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.dakrsnyk.ardane data 2>/dev/null || true)
          echo "app data: $DATA"
          if [ -n "$DATA" ] && [ -d "$DATA" ]; then
            rm -rf "$DATA/Documents/export"
            mkdir -p "$DATA/Documents"
            cp scripts/ad_export.txt "$DATA/Documents/ad_export.txt"
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane < /dev/null 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${ARGS[@]}" -screenshotScreen export < /dev/null > /dev/null || true
            for i in $(seq 1 600); do
              [ -f "$DATA/Documents/export/done.txt" ] && break
              sleep 2
            done
            [ -f "$DATA/Documents/export/done.txt" ] || echo "export: no done.txt after 20 minutes (progress.txt has what was done)" > $KIT/export-timeout.txt
            cp -R "$DATA/Documents/export/." $KIT/export/ 2>/dev/null || true
            echo "export: $(ls $KIT/export | wc -l | tr -d ' ') files"
          else
            echo "export: no app data container" > $KIT/export-timeout.txt
          fi

          # 4) Still screens and scroll slices (scripts/ad_screens.txt: <file> <screen> [launch arguments]):
          # one launch each, then a lossless screenshot. The slices -screenshotScroll 0 … 1 are stitched
          # into tall pictures offline.
          screen_shot() { # file screen [extra launch arguments]
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane < /dev/null 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${ARGS[@]}" -screenshotScreen "$2" "${@:3}" < /dev/null > /dev/null || true
            sleep 6
            xcrun simctl io "$DEVICE" screenshot --type=png "$KIT/screens/$1.png" < /dev/null > /dev/null 2>&1 || true
          }
          SCREENS=()
          while IFS= read -r line; do SCREENS+=("$line"); done < <(grep -vE '^[[:space:]]*(#|$)' scripts/ad_screens.txt)
          for line in "${SCREENS[@]}"; do
            read -r -a PARTS <<< "$line"
            [ "${#PARTS[@]}" -ge 2 ] && screen_shot "${PARTS[@]}"
          done
          xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane < /dev/null 2>/dev/null || true
          echo "adkit: $(ls $KIT/shots | wc -l | tr -d ' ') shots, $(ls $KIT/screens | wc -l | tr -d ' ') screens, $(ls $KIT/export | wc -l | tr -d ' ') export files"

      - name: App Store screenshots
        id: marketing
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.MARKETING == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p marketing
          exec > >(tee marketing/log.txt) 2>&1
          set -x
          APP=build/sim/Build/Products/Debug-iphonesimulator/Ardane.app
          xcrun simctl list devices | grep -E "Booted|$DEVICE"
          # A simulator sometimes never finishes booting: give up after 4 minutes and boot it again.
          if ! perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b; then
            xcrun simctl shutdown "$DEVICE"
            xcrun simctl boot "$DEVICE"
            perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b
          fi
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$DEVICE" "$APP"
          # The language of the App Store page (French unless MARKETING_LANG says otherwise).
          LANG_ARGS=(-AppleLanguages "(${MARKETING_LANG:-fr})" -AppleLocale "${MARKETING_LOCALE:-fr_CA}")
          # The first launch saves the demo data every scene reads.
          xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${LANG_ARGS[@]}" -screenshotScreen home
          sleep 8
          shot() { # file screen [extra launch arguments]
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane 2>/dev/null
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane "${LANG_ARGS[@]}" -screenshotScreen "$2" "${@:3}"
            sleep 7
            xcrun simctl io "$DEVICE" screenshot --type=png "marketing/$1.png"
          }
          LINES=()
          while IFS= read -r line; do LINES+=("$line"); done < <(grep -vE '^[[:space:]]*(#|$)' scripts/marketing_scenes.txt)
          for line in "${LINES[@]}"; do
            read -r scene screen <<< "$line"
            if [ -n "$screen" ]; then
              # A phone with the real screen: the screen area white then black, for difference matting.
              shot "$scene-white" "marketing-$scene" -marketingScreen white
              shot "$scene-black" "marketing-$scene" -marketingScreen black
            else
              shot "$scene" "marketing-$scene"
            fi
          done
          # The real screens that go inside the phones. A screen captured before it is drawn is almost
          # empty (a white PNG of about 100 KB, a real screen is 800 KB or more): it is taken again.
          for screen in $(printf '%s\n' "${LINES[@]}" | awk 'NF > 1 { print $2 }' | sort -u); do
            for attempt in 1 2 3; do
              shot "screen-$screen" "$screen"
              [ "$(stat -f%z "marketing/screen-$screen.png")" -gt 300000 ] && break
              sleep 5
            done
          done
          # Not on the App Store page: screens to review with the captures.
          shot extra-icons icons
          sips -g pixelWidth -g pixelHeight marketing/hero.png

      - name: Release build (App Store configuration) without the test unlock
        id: release
        if: steps.sim.outcome == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Ardane.xcodeproj -scheme Ardane -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
          # Proof that the test unlock is not in the App Store build: neither its code nor its settings key.
          APP=build/release/Build/Products/Release-iphonesimulator/Ardane.app
          FOUND=0
          for bin in "$APP/Ardane" "$APP/PlugIns/ArdaneWidgets.appex/ArdaneWidgets"; do
            if strings -a "$bin" | grep -E "DebugPremium|debugPremiumDisabled|ScreenshotMode|WidgetGalleryView|SetupGalleryView|MarketingView|AdExport"; then FOUND=1; fi
          done
          echo "test unlock found in Release binaries: $FOUND" | tee release-check.txt
          [ "$FOUND" = "0" ]

      - name: Publish build report
        if: always()
        run: |
          mkdir -p report
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "static: ${{ steps.static.outcome }}"
            echo "simulator: ${{ steps.sim.outcome }}"
            echo "device: ${{ steps.device.outcome }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo "ipa: ${{ (steps.device.outcome == 'success' && steps.tests.outcome != 'failure') && 'published' || 'not published' }}"
            echo "screenshots: ${{ steps.shots.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            echo "testflight: ${{ steps.testflight.outcome }}"
            cat testflight.txt 2>/dev/null || true
            echo "marketing: ${{ steps.marketing.outcome }}"
            echo "videos: ${{ steps.videos.outcome }}"
            ls -l videos/*.mp4 2>/dev/null || true
            echo "adkit: ${{ steps.adkit.outcome }}"
            for KITDIR in adkit adkit-en; do
            if [ -d $KITDIR ]; then
              echo "$KITDIR: $(find $KITDIR/shots -name '*.png' 2>/dev/null | wc -l | tr -d ' ') shots ($(find $KITDIR/attachments -name '*.png' 2>/dev/null | wc -l | tr -d ' ') in-test copies), $(find $KITDIR/screens -name '*.png' 2>/dev/null | wc -l | tr -d ' ') screens, $(find $KITDIR/export -type f 2>/dev/null | wc -l | tr -d ' ') export files"
              grep -hE "Test Case .*(passed|failed)" $KITDIR/logs/*.log 2>/dev/null || true
              cat $KITDIR/missed.txt 2>/dev/null || true
              echo "---- adkit export (done.txt) ----"
              cat $KITDIR/export/done.txt 2>/dev/null || cat $KITDIR/export-timeout.txt 2>/dev/null || echo "no done.txt"
            fi
            done
            cat release-check.txt 2>/dev/null || true
            echo "---- errors ----"
            python3 scripts/check_swift.py 2>&1 | tail -40 || true
            python3 scripts/l10n_catalog.py sync 2>&1 | tail -45 || true
            grep -hE "error:" sim.log device.log release.log archive.log export.log 2>/dev/null | sort -u | head -500 || true
            [ -f export.log ] && { echo "---- testflight export ----"; tail -60 export.log; } || true
            echo "---- tests ----"
            grep -hE "Test Case .*(passed|failed)|error:|XCTAssert|TEST (SUCCEEDED|FAILED)" test.log 2>/dev/null | head -400 || true
            if [ -f stack-onone.log ]; then
              echo "---- stack check: unoptimized, 1 MB stack ----"
              grep -hE "Test Case .*(passed|failed)|crash|Crash|TEST (SUCCEEDED|FAILED)|EXC_|stack" stack-onone.log | head -40 || true
              echo "---- stack check: optimized (-O), 1 MB stack ----"
              grep -hE "BUILD (SUCCEEDED|FAILED)|error:" stack-build-o.log | head -10 || true
              grep -hE "Test Case .*(passed|failed)|crash|Crash|TEST (SUCCEEDED|FAILED)|EXC_|stack" stack-o.log | head -40 || true
            fi
            APPDIR=build/sim/Build/Products/Debug-iphonesimulator/Ardane.app
            echo "privacy manifest: app $([ -f $APPDIR/PrivacyInfo.xcprivacy ] && echo yes || echo MISSING), widget $([ -f $APPDIR/PlugIns/ArdaneWidgets.appex/PrivacyInfo.xcprivacy ] && echo yes || echo MISSING)"
            echo "alternate app icons in the app: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons' $APPDIR/Info.plist 2>/dev/null | grep -c '= Dict')"
            echo "---- widget extension bundle ----"
            ls build/sim/Build/Products/Debug-iphonesimulator/Ardane.app/PlugIns/ArdaneWidgets.appex 2>/dev/null || true
            ls build/sim/Build/Products/Debug-iphonesimulator/Ardane.app/PlugIns/ArdaneWidgets.appex/Metadata.appintents 2>/dev/null || true
            grep -E "ExtractAppIntentsMetadata \(in target" sim.log 2>/dev/null | head -5 || true
            echo "---- last lines ----"
            tail -40 sim.log 2>/dev/null || true
          } > report/report.txt
          [ -d shots ] && cp shots/*.jpg report/ 2>/dev/null || true
          [ -d marketing ] && mkdir -p report/marketing && cp marketing/* report/marketing/ 2>/dev/null || true
          [ -d videos ] && mkdir -p report/videos && cp videos/*.mp4 videos/*.log report/videos/ 2>/dev/null || true
          [ -d videos/assets ] && cp -R videos/assets report/videos/ 2>/dev/null || true
          [ -d adkit ] && mkdir -p report/adkit && cp -R adkit/. report/adkit/ 2>/dev/null || true
          [ -d adkit-en ] && mkdir -p report/adkit-en && cp -R adkit-en/. report/adkit-en/ 2>/dev/null || true
          [ -d testshots ] && mkdir -p report/tests && cp testshots/* report/tests/ 2>/dev/null || true
          [ -d stackreports ] && mkdir -p report/stack && cp -R stackreports/* report/stack/ 2>/dev/null || true
          cd report
          git init -q
          git checkout -q -b ci-report
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report
