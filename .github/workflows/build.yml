name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 110
    env:
      # Tests and screenshots cost macOS minutes: only on a manual run or with [qa] in the commit message.
      # A plain push only builds: the IPA is in the report within about ten minutes.
      QA: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]') || contains(github.event.head_commit.message, '[shots]') || contains(github.event.head_commit.message, '[studio]') || contains(github.event.head_commit.message, '[apps]') || contains(github.event.head_commit.message, '[demos]') || contains(github.event.head_commit.message, '[daily]') || contains(github.event.head_commit.message, '[langs]') || contains(github.event.head_commit.message, '[store]') }}
      # [demos] runs the logic tests and the exercise sheet UI tests, then the demonstrations of every exercise.
      DEMOS: ${{ contains(github.event.head_commit.message, '[demos]') }}
      # [daily] runs the logic tests and the UI tests of Mon Quotidien, Créer, the Studio and the first launch,
      # then the captures of the swipeable cards, the settings inside a mini-app, the Lock Screen category,
      # the gender choices, Thème / Style, and the rating link.
      DAILY: ${{ contains(github.event.head_commit.message, '[daily]') }}
      # [studio] runs the logic tests and the Studio UI tests, then only the Widget Studio captures.
      STUDIO: ${{ contains(github.event.head_commit.message, '[studio]') }}
      # [apps] runs the logic tests and the mini-app UI tests, then only the mini-app captures.
      APPS: ${{ contains(github.event.head_commit.message, '[apps]') }}
      # [place] only builds for the simulator and runs the widget placement tests (cheapest check).
      PLACE: ${{ contains(github.event.head_commit.message, '[place]') }}
      # [shots] builds (IPA included) and takes the screenshots, without the tests.
      SHOTSONLY: ${{ contains(github.event.head_commit.message, '[shots]') }}
      # [langs] builds and takes the key screens in every translated language (no tests), to spot truncations.
      LANGS: ${{ contains(github.event.head_commit.message, '[langs]') }}
      # [unit] builds (IPA included) and runs the logic tests only, without the UI tests or screenshots.
      UNIT: ${{ contains(github.event.head_commit.message, '[unit]') }}
      # [store] runs the logic tests, then only the Store captures (every aisle) and the styles side by side.
      STORE: ${{ contains(github.event.head_commit.message, '[store]') }}
      # [check] only compiles for the simulator (fastest way to find compile errors).
      CHECK: ${{ contains(github.event.head_commit.message, '[check]') }}
      # [marketing] renders the App Store screenshots on a 6.9" iPhone (1320 x 2868).
      MARKETING: ${{ contains(github.event.head_commit.message, '[marketing]') }}
      # [stack] runs the Home and mini-app UI tests with the iPhone's 1 MB main-thread stack, first
      # unoptimized (like the old test IPA), then optimized (like the IPA now), and reports both.
      STACK: ${{ contains(github.event.head_commit.message, '[stack]') }}
      # [video] films the scenes of the promo videos (UITests/PromoVideoUITests) on the simulator, one
      # recording per scene, in report/videos (no tests, no IPA).
      VIDEO: ${{ contains(github.event.head_commit.message, '[video]') }}
      # [adkit] builds like [video] and renders the ad kit in report/adkit (no screen recording, no tests,
      # no IPA): lossless screenshots of real states played by UITests/AdShotsUITests (shots/), still screens
      # and scroll slices from scripts/ad_screens.txt (screens/), and the pieces the app exports as PNG files
      # with true transparency from scripts/ad_export.txt (export/, see App/Core/AdExport.swift).
      ADKIT: ${{ contains(github.event.head_commit.message, '[adkit]') }}
      # [adkit-en] is the same kit in English (Canada), written in report/adkit-en so the French kit is kept.
      # Not together with [adkit]: if both are there, only the English kit is made.
      ADKIT_EN: ${{ contains(github.event.head_commit.message, '[adkit-en]') }}
      # [testflight] signs a Release build with the Apple Developer account and uploads it to TestFlight
      # (no simulator build, no tests, no test IPA). Secrets: see scripts/signing/README.md.
      # [interne] does the same with Premium unlocked (INTERNAL_PREMIUM), uploaded « TestFlight Internal
      # Only »: Apple never lets that build reach the App Store or external testers.
      TESTFLIGHT: ${{ contains(github.event.head_commit.message, '[testflight]') || contains(github.event.head_commit.message, '[interne]') }}
      INTERNE: ${{ contains(github.event.head_commit.message, '[interne]') }}
      BOTH_TESTFLIGHT_TAGS: ${{ contains(github.event.head_commit.message, '[interne]') && contains(github.event.head_commit.message, '[testflight]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Static checks (initializers, widget catalog, Release safety)
        id: static
        run: python3 scripts/check_swift.py

      - name: Boot a simulator early
        if: env.QA == 'true' || env.PLACE == 'true' || env.UNIT == 'true' || env.MARKETING == 'true' || env.STACK == 'true' || env.VIDEO == 'true' || env.ADKIT == 'true' || env.ADKIT_EN == 'true'
        continue-on-error: true
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          if os.environ.get('MARKETING') == 'true':
              names = ['iPhone 17 Pro Max', 'iPhone 16 Pro Max', 'iPhone Air']
              preferred = [d for name in names for d in phones if d['name'] == name]
          else:
              preferred = [d for d in phones if d['name'] == 'iPhone 16 Pro'] or [d for d in phones if 'Pro' in d['name']]
          print((preferred or phones)[0 if os.environ.get('MARKETING') == 'true' else -1]['udid'])
          ")
          echo "Simulator: $(xcrun simctl list devices | grep $DEVICE)"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true

      - name: TestFlight signing (certificate and provisioning profiles)
        id: tfsign
        if: env.TESTFLIGHT == 'true' && steps.static.outcome == 'success'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ "$BOTH_TESTFLIGHT_TAGS" = "true" ]; then echo "::error::[testflight] et [interne] dans le même message : choisir l'un des deux" | tee testflight.txt; exit 1; fi
          missing=""
          for v in APPLE_TEAM_ID DIST_P12_BASE64 DIST_P12_PASSWORD PROFILE_APP_BASE64 PROFILE_WIDGETS_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing (scripts/signing/README.md)" | tee testflight.txt; exit 1; fi
          # The distribution certificate, in a keychain of its own for this run.
          KEYCHAIN="$RUNNER_TEMP/ardane.keychain-db"; KC_PASS=$(openssl rand -hex 16)
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | tee -a testflight.txt
          # The two App Store profiles, under their UUID (both folders: Xcode 16+ reads the second one).
          for pair in "PROFILE_APP_BASE64:Ardane App Store" "PROFILE_WIDGETS_BASE64:Ardane Widgets App Store"; do
            var=${pair%%:*}; expected=${pair#*:}
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
            echo "profile: $name ($uuid), expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")" | tee -a testflight.txt
            [ "$name" = "$expected" ] || { echo "::error::Le profil s'appelle « $name », attendu « $expected »" | tee -a testflight.txt; exit 1; }
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"; cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
            done
          done
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: TestFlight archive and upload
        id: testflight
        if: steps.tfsign.outcome == 'success'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # [interne]: Premium unlocked, and the upload is restricted to internal testers.
          EXTRA=()
          INTERNAL_ONLY=""
          KIND="version 1.0"
          if [ "$INTERNE" = "true" ]; then
            EXTRA=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) INTERNAL_PREMIUM')
            INTERNAL_ONLY="<key>testFlightInternalTestingOnly</key><true/>"
            KIND="version 1.0, interne seulement, Premium débloqué"
          fi
          xcodebuild -project Ardane.xcodeproj -scheme Ardane -configuration Release             -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Ardane.xcarchive             DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} "${EXTRA[@]}" archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          # Proof from the binary itself: « … en mode test » is compiled only with DEBUG or INTERNAL_PREMIUM.
          APP=$(find build/Ardane.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          EXE="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if [ "$INTERNE" = "true" ]; then
            grep -a -q "en mode test" "$EXE" || { echo "::error::Premium non débloqué dans la version interne" | tee -a testflight.txt; exit 1; }
          else
            ! grep -a -q "en mode test" "$EXE" || { echo "::error::Déblocage Premium trouvé dans une version [testflight] normale" | tee -a testflight.txt; exit 1; }
          fi
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.dakrsnyk.ardane</key><string>Ardane App Store</string>
              <key>com.dakrsnyk.ardane.widgets</key><string>Ardane Widgets App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            $INTERNAL_ONLY
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Ardane.xcarchive -exportOptionsPlist build/ExportOptions.plist             -exportPath build/export -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"             -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED" export.log
          echo "uploaded: build ${{ github.run_number }} ($KIND)" | tee -a testflight.txt
          # The internal build must really be « Internal Only » in App Store Connect; otherwise it is expired.
          if [ "$INTERNE" = "true" ]; then
            /usr/libexec/PlistBuddy -c 'Print :testFlightInternalTestingOnly' build/ExportOptions.plist | grep -q true
            python3 scripts/signing/check_internal_build.py "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" com.dakrsnyk.ardane ${{ github.run_number }} | tee -a testflight.txt
          fi

      - name: Build for the simulator
        id: sim
        if: steps.static.outcome == 'success' && env.TESTFLIGHT != 'true'
        run: |
          set -o pipefail
          # Keep compiling the other files and targets after an error, so one run lists every error.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee sim.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Build for iPhone (unsigned)
        id: device
        if: steps.sim.outcome == 'success' && env.PLACE != 'true' && env.CHECK != 'true' && env.MARKETING != 'true' && env.VIDEO != 'true' && env.ADKIT != 'true' && env.ADKIT_EN != 'true'
        run: |
          set -o pipefail
          # Optimized (-O) like an App Store build: an unoptimized SwiftUI app can overflow the iPhone's
          # 1 MB main-thread stack (the simulator has 8 MB), and crash at launch on the device only.
          xcodebuild -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_DEBUG_DYLIB=NO SWIFT_OPTIMIZATION_LEVEL=-O \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log

      - name: Package IPA
        if: steps.device.outcome == 'success'
        run: |
          APP=build/device/Build/Products/Debug-iphoneos/Ardane.app
          # Signed without the App Group: a free Apple ID can't be granted ours, and a signature that
          # still claims it can keep iOS from starting the widget extension after Sideloadly re-signs.
          codesign --force --sign - "$APP/PlugIns/ArdaneWidgets.appex"
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Ardane.ipa Payload
          # Diagnostic variant: the widget extension without its App Intents metadata. If its
          # « Mon widget » shows up in the widget gallery while the normal build shows nothing,
          # the system rejects the metadata; if neither shows up, the extension isn't started.
          mkdir -p diagnostic/Payload
          cp -R "$APP" diagnostic/Payload/
          rm -rf diagnostic/Payload/Ardane.app/PlugIns/ArdaneWidgets.appex/Metadata.appintents
          codesign --force --sign - diagnostic/Payload/Ardane.app/PlugIns/ArdaneWidgets.appex
          codesign --force --sign - diagnostic/Payload/Ardane.app
          (cd diagnostic && zip -qry ../Ardane-diagnostic.ipa Payload)
          ls -lh Ardane.ipa Ardane-diagnostic.ipa

      - name: Tests (logic and widget placement)
        id: tests
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.SHOTSONLY != 'true' && env.LANGS != 'true' && (env.QA == 'true' || env.PLACE == 'true' || env.UNIT == 'true')
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$DEVICE" -b
          ONLY=""
          if [ "$PLACE" = "true" ] && [ "$QA" != "true" ]; then ONLY="-only-testing:ArdaneUITests"; fi
          if [ "$UNIT" = "true" ] && [ "$QA" != "true" ]; then ONLY="-only-testing:ArdaneTests"; fi
          if [ "$STORE" = "true" ]; then ONLY="-only-testing:ArdaneTests"; fi
          if [ "$APPS" = "true" ]; then ONLY="-only-testing:ArdaneTests -only-testing:ArdaneUITests/MiniAppUITests -only-testing:ArdaneUITests/DataEntryUITests -only-testing:ArdaneUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData"; fi
          if [ "$DAILY" = "true" ]; then ONLY="-only-testing:ArdaneTests -only-testing:ArdaneUITests/MiniAppUITests -only-testing:ArdaneUITests/StudioUITests -only-testing:ArdaneUITests/ProfileUITests"; fi
          if [ "$DEMOS" = "true" ]; then ONLY="-only-testing:ArdaneTests -only-testing:ArdaneUITests/MiniAppUITests/testTheLibraryFindsExercisesAndShowsTheirSheet -only-testing:ArdaneUITests/MiniAppUITests/testASessionKeepsItsPlaceWhenTheSheetOpens -only-testing:ArdaneUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData"; fi
          if [ "$STUDIO" = "true" ]; then ONLY="-only-testing:ArdaneTests -only-testing:ArdaneUITests/StudioUITests -only-testing:ArdaneUITests/DataEntryUITests/testEditorKeepsItsChangesWhileLoggingFood -only-testing:ArdaneUITests/ProfileUITests/testTheEditorAsksForWhatTheWidgetNeeds -only-testing:ArdaneUITests/ProfileUITests/testAPackOpensInTheStudio -only-testing:ArdaneUITests/ProfileUITests/testEachWidgetOfACombinedWidgetCanBeSet -only-testing:ArdaneUITests/DataEntryUITests/testCreatorKeepsItsWidgetWhileLoggingFood -only-testing:ArdaneUITests/ProfileUITests/testFirstLaunchAsksOnlyWhatMattersAndFillsMesInformations -only-testing:ArdaneUITests/ProfileUITests/testSkippingEverythingShowsNothingMadeUp -only-testing:ArdaneUITests/ProfileUITests/testTheTutorialReplaysFromSettingsAndEachStepCanBeSkipped"; fi
          xcodebuild test -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath TestResults.xcresult \
            -testLanguage fr -testRegion CA $ONLY ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)" || true
          mkdir -p testexport testshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path testexport || true
          python3 - <<'PY'
          import json, os, shutil
          manifest = os.path.join("testexport", "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                      # Skip the automatic recordings and event images: large and not useful here.
                      if item["exportedFileName"].endswith(".mp4") or name.startswith(("Screen Recording", "Synthesized Event", "UI Snapshot")):
                          continue
                      name = name.split("_0_")[0].replace(" ", "-")
                      ext = os.path.splitext(item["exportedFileName"])[1] or ".png"
                      shutil.copy(os.path.join("testexport", item["exportedFileName"]), os.path.join("testshots", name + ext))
          PY
          # What the widget extension logged while the system rendered it, and any crash report.
          xcrun simctl spawn "$DEVICE" log show --last 25m --style compact --info --debug \
            --predicate 'process == "ArdaneWidgets" OR (process == "chronod" AND messageType == error) OR eventMessage CONTAINS[c] "Returned view collection"' \
            2>&1 | tail -6000 > testshots/widget-log.txt || true
          grep -E "com.dakrsnyk.tessera.widgets:timeline|watchdog|rror" testshots/widget-log.txt | tail -300 > testshots/widget-summary.txt || true
          find ~/Library/Logs/DiagnosticReports -iname "*Ardane*" -mmin -40 -exec cp {} testshots/ \; 2>/dev/null || true
          ls testshots
          grep -q "TEST SUCCEEDED" test.log

      - name: Stack check
        id: stack
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.STACK == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          TESTS="-only-testing:ArdaneUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData -only-testing:ArdaneUITests/MiniAppUITests/testHomeListsTheMiniAppsAndTheWeatherOpens -only-testing:ArdaneUITests/MiniAppUITests/testNutritionOpensFromHomeAndManagesAMeal -only-testing:ArdaneUITests/MiniAppUITests/testFinancesEditsAnExpenseAndOpensItsPages"
          # 1) Unoptimized (-Onone), with the app's 1 MB main-thread stack: what the old test IPA did.
          xcodebuild -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simOnone ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-Onone build-for-testing > stack-build-onone.log 2>&1 || true
          xcodebuild test-without-building -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/simOnone -resultBundlePath StackOnone.xcresult $TESTS \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO > stack-onone.log 2>&1 || true
          mkdir -p stackreports
          find ~/Library/Logs/DiagnosticReports -iname "*Ardane*" -mmin -30 -exec cp {} stackreports/ \; 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -iname "*Ardane*" -mmin -30 -delete 2>/dev/null || true
          # 2) The build the tests and the IPA use (optimized by the project), same 1 MB stack.
          echo "BUILD SUCCEEDED (build/sim)" > stack-build-o.log
          xcodebuild test-without-building -project Ardane.xcodeproj -scheme Ardane -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath StackO.xcresult $TESTS \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO > stack-o.log 2>&1 || true
          mkdir -p stackreports/optimized
          find ~/Library/Logs/DiagnosticReports -iname "*Ardane*" -mmin -30 -exec cp {} stackreports/optimized/ \; 2>/dev/null || true
          ls -R stackreports

      - name: Screenshots
        id: shots
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.QA == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/Ardane.app
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          shoot() { # name screen scroll scheme [extra launch arguments]
            xcrun simctl ui "$DEVICE" appearance $4
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.ardane 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.ardane -AppleLanguages "(${SHOT_LANG:-fr})" -AppleLocale "${SHOT_LOCALE:-fr_CA}" -screenshotScreen $2 -screenshotScroll $3 "${@:5}"
            sleep ${WAIT:-5}
            xcrun simctl io "$DEVICE" screenshot --type=jpeg "shots/$1-$4.jpg"
          }
          # The Widget Studio: each section, then every style, theme, layout and chart side by side.
          studio_shots() {
            for section in content theme style colors background border chart density myStyles note multi; do
              shoot studio-$section studio-$section top light
            done
            shoot studio-colors-end studio-colors bottom light
            shoot studio-content-end studio-content bottom light
            shoot studio-background-dark studio-background top dark
            # The main color repainting a style, and palettes changing every color.
            for theme in neon minimal luxury paper; do shoot studio-main-$theme studio-main-$theme top light; done
            shoot studio-main-minimal-dark studio-main-minimal top dark
            for palette in ocean coral sunset; do shoot studio-palette-$palette studio-palette-$palette top light; done
            shoot gallery-palettes gallery-palettes top light
            for page in 1 2 3; do shoot gallery-recolor-$page gallery-recolor-$page top light; done
            shoot gallery-recolor-1-dark gallery-recolor-1 top dark
            # Créer: the selection, then the Studio with the widgets chosen.
            WAIT=9 shoot creator-studio creator-fitness top light -screenshotCreatorMulti YES -screenshotCreatorStudio YES
            WAIT=9 shoot creator-studio-medium creator-nutrition top light -screenshotCreatorFormat medium -screenshotCreatorStudio YES
            for page in 1 2 3 4; do shoot gallery-styles-$page gallery-styles-$page top light; done
            shoot gallery-styles-1-dark gallery-styles-1 top dark
            for page in 1 2; do shoot gallery-presets-$page gallery-presets-$page top light; done
