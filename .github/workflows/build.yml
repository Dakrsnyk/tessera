            shoot onboarding onboarding top $scheme
            shoot setups setups top $scheme
          done
          shoot setups-free setups-free top light
          shoot setups-end setups bottom light
          for setup in aurore creme neon; do shoot setup-$setup setup-$setup top light; done
          shoot gallery-setups-home gallery-setups-home top light
