            WAIT=12 shoot tutorial-welcome tutorial-welcome top light
            for step in daily info create studio store mine homeScreen finish; do
              WAIT=6 shoot tutorial-$step tutorial-$step top light
            done
            WAIT=6 shoot tutorial-daily-dark tutorial-daily top dark
            WAIT=6 shoot tutorial-store-dark tutorial-store top dark
