name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 110
    env:
      # Tests and screenshots cost macOS minutes: only on a manual run or with [qa] in the commit message.
      # A plain push only builds: the IPA is in the report within about ten minutes.
      QA: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]') || contains(github.event.head_commit.message, '[shots]') || contains(github.event.head_commit.message, '[studio]') || contains(github.event.head_commit.message, '[apps]') || contains(github.event.head_commit.message, '[demos]') || contains(github.event.head_commit.message, '[daily]') || contains(github.event.head_commit.message, '[langs]') || contains(github.event.head_commit.message, '[store]') }}
      # [demos] runs the logic tests and the exercise sheet UI tests, then the demonstrations of every exercise.
      DEMOS: ${{ contains(github.event.head_commit.message, '[demos]') }}
      # [daily] runs the logic tests and the UI tests of Mon Quotidien, Créer, the Studio and the first launch,
      # then the captures of the swipeable cards, the settings inside a mini-app, the Lock Screen category,
      # the gender choices, Thème / Style, and the rating link.
      DAILY: ${{ contains(github.event.head_commit.message, '[daily]') }}
      # [studio] runs the logic tests and the Studio UI tests, then only the Widget Studio captures.
      STUDIO: ${{ contains(github.event.head_commit.message, '[studio]') }}
      # [apps] runs the logic tests and the mini-app UI tests, then only the mini-app captures.
      APPS: ${{ contains(github.event.head_commit.message, '[apps]') }}
      # [place] only builds for the simulator and runs the widget placement tests (cheapest check).
      PLACE: ${{ contains(github.event.head_commit.message, '[place]') }}
      # [shots] builds (IPA included) and takes the screenshots, without the tests.
      SHOTSONLY: ${{ contains(github.event.head_commit.message, '[shots]') }}
      # [langs] builds and takes the key screens in every translated language (no tests), to spot truncations.
      LANGS: ${{ contains(github.event.head_commit.message, '[langs]') }}
      # [unit] builds (IPA included) and runs the logic tests only, without the UI tests or screenshots.
      UNIT: ${{ contains(github.event.head_commit.message, '[unit]') }}
      # [store] runs the logic tests, then only the Store captures (every aisle) and the styles side by side.
      STORE: ${{ contains(github.event.head_commit.message, '[store]') }}
      # [check] only compiles for the simulator (fastest way to find compile errors).
      CHECK: ${{ contains(github.event.head_commit.message, '[check]') }}
      # [marketing] renders the App Store screenshots on a 6.9" iPhone (1320 x 2868).
      MARKETING: ${{ contains(github.event.head_commit.message, '[marketing]') }}
      # [stack] runs the Home and mini-app UI tests with the iPhone's 1 MB main-thread stack, first
      # unoptimized (like the old test IPA), then optimized (like the IPA now), and reports both.
      STACK: ${{ contains(github.event.head_commit.message, '[stack]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Static checks (initializers, widget catalog, Release safety)
        id: static
        run: python3 scripts/check_swift.py

      - name: Boot a simulator early
        if: env.QA == 'true' || env.PLACE == 'true' || env.UNIT == 'true' || env.MARKETING == 'true' || env.STACK == 'true'
        continue-on-error: true
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          if os.environ.get('MARKETING') == 'true':
              names = ['iPhone 17 Pro Max', 'iPhone 16 Pro Max', 'iPhone Air']
              preferred = [d for name in names for d in phones if d['name'] == name]
          else:
              preferred = [d for d in phones if d['name'] == 'iPhone 16 Pro'] or [d for d in phones if 'Pro' in d['name']]
          print((preferred or phones)[0 if os.environ.get('MARKETING') == 'true' else -1]['udid'])
          ")
          echo "Simulator: $(xcrun simctl list devices | grep $DEVICE)"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true

      - name: Build for the simulator
        id: sim
        if: steps.static.outcome == 'success'
        run: |
          set -o pipefail
          # Keep compiling the other files and targets after an error, so one run lists every error.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee sim.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Build for iPhone (unsigned)
        id: device
        if: steps.sim.outcome == 'success' && env.PLACE != 'true' && env.CHECK != 'true' && env.MARKETING != 'true'
        run: |
          set -o pipefail
          # Optimized (-O) like an App Store build: an unoptimized SwiftUI app can overflow the iPhone's
          # 1 MB main-thread stack (the simulator has 8 MB), and crash at launch on the device only.
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_DEBUG_DYLIB=NO SWIFT_OPTIMIZATION_LEVEL=-O \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log

      - name: Package IPA
        if: steps.device.outcome == 'success'
        run: |
          APP=build/device/Build/Products/Debug-iphoneos/Tessera.app
          # Signed without the App Group: a free Apple ID can't be granted ours, and a signature that
          # still claims it can keep iOS from starting the widget extension after Sideloadly re-signs.
          codesign --force --sign - "$APP/PlugIns/TesseraWidgets.appex"
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tessera.ipa Payload
          # Diagnostic variant: the widget extension without its App Intents metadata. If its
          # « Mon widget » shows up in the widget gallery while the normal build shows nothing,
          # the system rejects the metadata; if neither shows up, the extension isn't started.
          mkdir -p diagnostic/Payload
          cp -R "$APP" diagnostic/Payload/
          rm -rf diagnostic/Payload/Tessera.app/PlugIns/TesseraWidgets.appex/Metadata.appintents
          codesign --force --sign - diagnostic/Payload/Tessera.app/PlugIns/TesseraWidgets.appex
          codesign --force --sign - diagnostic/Payload/Tessera.app
          (cd diagnostic && zip -qry ../Tessera-diagnostic.ipa Payload)
          ls -lh Tessera.ipa Tessera-diagnostic.ipa

      - name: Tests (logic and widget placement)
        id: tests
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.SHOTSONLY != 'true' && env.LANGS != 'true' && (env.QA == 'true' || env.PLACE == 'true' || env.UNIT == 'true')
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$DEVICE" -b
          ONLY=""
          if [ "$PLACE" = "true" ] && [ "$QA" != "true" ]; then ONLY="-only-testing:TesseraUITests"; fi
          if [ "$UNIT" = "true" ] && [ "$QA" != "true" ]; then ONLY="-only-testing:TesseraTests"; fi
          if [ "$STORE" = "true" ]; then ONLY="-only-testing:TesseraTests"; fi
          if [ "$APPS" = "true" ]; then ONLY="-only-testing:TesseraTests -only-testing:TesseraUITests/MiniAppUITests -only-testing:TesseraUITests/DataEntryUITests -only-testing:TesseraUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData"; fi
          if [ "$DAILY" = "true" ]; then ONLY="-only-testing:TesseraTests -only-testing:TesseraUITests/MiniAppUITests -only-testing:TesseraUITests/StudioUITests -only-testing:TesseraUITests/ProfileUITests"; fi
          if [ "$DEMOS" = "true" ]; then ONLY="-only-testing:TesseraTests -only-testing:TesseraUITests/MiniAppUITests/testTheLibraryFindsExercisesAndShowsTheirSheet -only-testing:TesseraUITests/MiniAppUITests/testASessionKeepsItsPlaceWhenTheSheetOpens -only-testing:TesseraUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData"; fi
          if [ "$STUDIO" = "true" ]; then ONLY="-only-testing:TesseraTests -only-testing:TesseraUITests/StudioUITests -only-testing:TesseraUITests/DataEntryUITests/testEditorKeepsItsChangesWhileLoggingFood -only-testing:TesseraUITests/ProfileUITests/testTheEditorAsksForWhatTheWidgetNeeds -only-testing:TesseraUITests/ProfileUITests/testAPackOpensInTheStudio -only-testing:TesseraUITests/ProfileUITests/testEachWidgetOfACombinedWidgetCanBeSet -only-testing:TesseraUITests/DataEntryUITests/testCreatorKeepsItsWidgetWhileLoggingFood -only-testing:TesseraUITests/ProfileUITests/testFirstLaunchAsksOnlyWhatMattersAndFillsMesInformations -only-testing:TesseraUITests/ProfileUITests/testSkippingEverythingShowsNothingMadeUp -only-testing:TesseraUITests/ProfileUITests/testTheTutorialReplaysFromSettingsAndEachStepCanBeSkipped"; fi
          xcodebuild test -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath TestResults.xcresult \
            -testLanguage fr -testRegion CA $ONLY ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)" || true
          mkdir -p testexport testshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path testexport || true
          python3 - <<'PY'
          import json, os, shutil
          manifest = os.path.join("testexport", "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                      # Skip the automatic recordings and event images: large and not useful here.
                      if item["exportedFileName"].endswith(".mp4") or name.startswith(("Screen Recording", "Synthesized Event", "UI Snapshot")):
                          continue
                      name = name.split("_0_")[0].replace(" ", "-")
                      ext = os.path.splitext(item["exportedFileName"])[1] or ".png"
                      shutil.copy(os.path.join("testexport", item["exportedFileName"]), os.path.join("testshots", name + ext))
          PY
          # What the widget extension logged while the system rendered it, and any crash report.
          xcrun simctl spawn "$DEVICE" log show --last 25m --style compact --info --debug \
            --predicate 'process == "TesseraWidgets" OR (process == "chronod" AND messageType == error) OR eventMessage CONTAINS[c] "Returned view collection"' \
            2>&1 | tail -6000 > testshots/widget-log.txt || true
          grep -E "com.dakrsnyk.tessera.widgets:timeline|watchdog|rror" testshots/widget-log.txt | tail -300 > testshots/widget-summary.txt || true
          find ~/Library/Logs/DiagnosticReports -iname "*Tessera*" -mmin -40 -exec cp {} testshots/ \; 2>/dev/null || true
          ls testshots
          grep -q "TEST SUCCEEDED" test.log

      - name: Stack check
        id: stack
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.STACK == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          TESTS="-only-testing:TesseraUITests/ProfileUITests/testMonQuotidienShowsTheDayFromTheUsersData -only-testing:TesseraUITests/MiniAppUITests/testHomeListsTheMiniAppsAndTheWeatherOpens -only-testing:TesseraUITests/MiniAppUITests/testNutritionOpensFromHomeAndManagesAMeal -only-testing:TesseraUITests/MiniAppUITests/testFinancesEditsAnExpenseAndOpensItsPages"
          # 1) Unoptimized (-Onone), with the app's 1 MB main-thread stack: what the old test IPA did.
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simOnone ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-Onone build-for-testing > stack-build-onone.log 2>&1 || true
          xcodebuild test-without-building -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/simOnone -resultBundlePath StackOnone.xcresult $TESTS \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO > stack-onone.log 2>&1 || true
          mkdir -p stackreports
          find ~/Library/Logs/DiagnosticReports -iname "*Tessera*" -mmin -30 -exec cp {} stackreports/ \; 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -iname "*Tessera*" -mmin -30 -delete 2>/dev/null || true
          # 2) The build the tests and the IPA use (optimized by the project), same 1 MB stack.
          echo "BUILD SUCCEEDED (build/sim)" > stack-build-o.log
          xcodebuild test-without-building -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath StackO.xcresult $TESTS \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO > stack-o.log 2>&1 || true
          mkdir -p stackreports/optimized
          find ~/Library/Logs/DiagnosticReports -iname "*Tessera*" -mmin -30 -exec cp {} stackreports/optimized/ \; 2>/dev/null || true
          ls -R stackreports

      - name: Screenshots
        id: shots
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.QA == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/Tessera.app
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          shoot() { # name screen scroll scheme [extra launch arguments]
            xcrun simctl ui "$DEVICE" appearance $4
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.tessera 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera -AppleLanguages "(${SHOT_LANG:-fr})" -AppleLocale "${SHOT_LOCALE:-fr_CA}" -screenshotScreen $2 -screenshotScroll $3 "${@:5}"
            sleep ${WAIT:-5}
            xcrun simctl io "$DEVICE" screenshot --type=jpeg "shots/$1-$4.jpg"
          }
          # The Widget Studio: each section, then every style, theme, layout and chart side by side.
          studio_shots() {
            for section in content theme style colors background border chart density myStyles note multi; do
              shoot studio-$section studio-$section top light
            done
            shoot studio-colors-end studio-colors bottom light
            shoot studio-content-end studio-content bottom light
            shoot studio-background-dark studio-background top dark
            # The main color repainting a style, and palettes changing every color.
            for theme in neon minimal luxury paper; do shoot studio-main-$theme studio-main-$theme top light; done
            shoot studio-main-minimal-dark studio-main-minimal top dark
            for palette in ocean coral sunset; do shoot studio-palette-$palette studio-palette-$palette top light; done
            shoot gallery-palettes gallery-palettes top light
            for page in 1 2 3; do shoot gallery-recolor-$page gallery-recolor-$page top light; done
            shoot gallery-recolor-1-dark gallery-recolor-1 top dark
            # Créer: the selection, then the Studio with the widgets chosen.
            WAIT=9 shoot creator-studio creator-fitness top light -screenshotCreatorMulti YES -screenshotCreatorStudio YES
            WAIT=9 shoot creator-studio-medium creator-nutrition top light -screenshotCreatorFormat medium -screenshotCreatorStudio YES
            for page in 1 2 3 4; do shoot gallery-styles-$page gallery-styles-$page top light; done
            shoot gallery-styles-1-dark gallery-styles-1 top dark
            for page in 1 2; do shoot gallery-presets-$page gallery-presets-$page top light; done
            for size in small medium large; do shoot gallery-layouts-$size gallery-layouts-$size top light; done
            shoot gallery-charts gallery-charts top light
            shoot gallery-looks gallery-looks top light
          }
          # The tutorial after the first questions: each step, on the app itself.
          tutorial_shots() {
            # The first launch after the install takes longer.
            WAIT=12 shoot tutorial-welcome tutorial-welcome top light
            for step in daily info create studio store mine homeScreen finish; do
              WAIT=6 shoot tutorial-$step tutorial-$step top light
            done
            WAIT=6 shoot tutorial-daily-dark tutorial-daily top dark
            WAIT=6 shoot tutorial-store-dark tutorial-store top dark
          }
          # The app's mark (« T en creux ») where it appears: launch, first launch, Premium, Home Screen setups.
          brand_shots() {
            shoot brand-launch launch top light
            shoot brand-launch-dark launch top dark
            shoot brand-onboarding onboarding top light
            shoot brand-paywall paywall top light
            for setup in aurore creme neon; do shoot brand-setup-$setup setup-$setup top light; done
          }
          # The mini-apps opened from Home: each dashboard, then its pages.
          app_shots() {
            for screen in app-nutrition app-nutrition-meal app-nutrition-history app-nutrition-ideas app-nutrition-nutrients app-nutrition-saved; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-nutrition-end app-nutrition bottom light
            WAIT=7 shoot app-nutrition-history-end app-nutrition-history bottom light
            WAIT=7 shoot app-nutrition-dark app-nutrition top dark
            for screen in app-fitness app-fitness-session app-fitness-program app-fitness-library app-fitness-exercise app-fitness-history app-fitness-progress app-fitness-activity; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-fitness-end app-fitness bottom light
            WAIT=7 shoot app-fitness-exercise-end app-fitness-exercise bottom light
            WAIT=7 shoot app-fitness-session-end app-fitness-session bottom light
            for screen in app-planning app-planning-tasks app-planning-week app-planning-month app-planning-projects app-planning-habits app-planning-focus; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-planning-end app-planning bottom light
            WAIT=7 shoot app-planning-dark app-planning top dark
            for screen in app-studies app-studies-timetable app-studies-courses app-studies-course app-studies-exams app-studies-assignments app-studies-grades app-studies-revision; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-studies-end app-studies bottom light
            WAIT=7 shoot app-studies-course-end app-studies-course bottom light
            WAIT=7 shoot app-studies-revision-end app-studies-revision bottom light
            for screen in app-finances app-finances-transactions app-finances-categories app-finances-bills app-finances-savings app-finances-trends; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-finances-end app-finances bottom light
            WAIT=7 shoot app-finances-dark app-finances top dark
            for screen in app-business app-business-sales app-business-results app-business-recurring app-business-metrics; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-business-end app-business bottom light
            for screen in app-travel app-travel-program app-travel-budget app-travel-checklist; do
              WAIT=8 shoot $screen $screen top light
            done
            WAIT=8 shoot app-travel-end app-travel bottom light
            for screen in app-car app-car-fuel app-car-mileage app-car-maintenance app-car-deadlines app-car-costs; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-car-end app-car bottom light
            WAIT=10 shoot app-weather app-weather top light
            WAIT=10 shoot app-weather-end app-weather bottom light
            WAIT=10 shoot app-weather-dark app-weather top dark
            WAIT=8 shoot home-apps home 0.3 light
          }
          if [ "$LANGS" = "true" ]; then
            for pair in en:en_US de:de_DE ja:ja_JP es:es_MX it:it_IT pt-BR:pt_BR; do
              export SHOT_LANG=${pair%%:*} SHOT_LOCALE=${pair#*:}
              # A fresh install per language: the demo data is created again, in that language.
              xcrun simctl uninstall "$DEVICE" com.dakrsnyk.tessera || true
              xcrun simctl install "$DEVICE" "$APP"
              WAIT=12 shoot $SHOT_LANG-home-fresh home-fresh top light
              WAIT=8 shoot $SHOT_LANG-home home top light
              for screen in home-pages store paywall settings onboarding-sport spaces-lock mywidgets creator-fitness studio-theme app-nutrition app-fitness app-planning app-finances; do
                WAIT=8 shoot $SHOT_LANG-$screen $screen top light
              done
              WAIT=8 shoot $SHOT_LANG-home home top dark
            done
            exit 0
          fi
          if [ "$STORE" = "true" ]; then
            shoot store store top light
            for slice in 0.12 0.24 0.36 0.48 0.6 0.72 0.84; do shoot store-at-$slice store $slice light; done
            shoot store-end store bottom light
            shoot store-at-0.3-dark store 0.3 dark
            for page in 1 2 3 4; do shoot gallery-styles-$page gallery-styles-$page top light; done
            exit 0
          fi
          if [ "$STUDIO" = "true" ]; then
            brand_shots
            tutorial_shots
            exit 0
          fi
          if [ "$DAILY" = "true" ]; then
            for look in light dark; do
              WAIT=8 shoot home home top $look
              WAIT=8 shoot home-pages home-pages top $look
              WAIT=8 shoot app-nutrition-settings app-nutrition bottom $look
              WAIT=8 shoot app-fitness-settings app-fitness bottom $look
              WAIT=7 shoot spaces-lock spaces-lock top $look
            done
            WAIT=7 shoot spaces-lock-end spaces-lock bottom light
            WAIT=7 shoot creator-fitness creator-fitness top light
            WAIT=8 shoot onboarding-sport onboarding-sport bottom light
            WAIT=8 shoot studio-theme studio-theme top light
            WAIT=8 shoot studio-style studio-style top light
            WAIT=7 shoot settings-end settings bottom light
            exit 0
          fi
          if [ "$DEMOS" = "true" ]; then
            # Every exercise: start, middle and end of the movement, as the app draws them.
            WAIT=10 shoot gallery-demos-1 gallery-demos-1 top light
            for page in $(seq 2 21); do WAIT=6 shoot gallery-demos-$page gallery-demos-$page top light; done
            for page in 1 3 9; do WAIT=6 shoot gallery-demos-$page-v1 gallery-demos-$page-v1 top light; done
            WAIT=6 shoot gallery-demos-1-dark gallery-demos-1 top dark
            # The exercise sheet, animated, on the three exercises reported.
            for id in incline-bench pec-deck leg-extension; do WAIT=8 shoot app-fitness-exercise-$id app-fitness-exercise-$id top light; done
            WAIT=8 shoot app-fitness-exercise-pec-deck app-fitness-exercise-pec-deck top dark
            # The Home header: search on the left, Tessera in the middle, the profile on the right.
            WAIT=8 shoot home home top light
            WAIT=8 shoot home home top dark
            exit 0
          fi
          if [ "$APPS" = "true" ]; then
            app_shots
            WAIT=7 shoot app-nutrition-fresh app-nutrition-fresh top light
            exit 0
          fi
          for screen in home spaces store editor-v2 paywall settings mywidgets space-nutrition space-fitness space-budget space-business space-student space-travel space-car space-productivity space-investing space-markets space-life; do
            shoot $screen $screen top light
          done
          for page in 1 2 3 4 5 6; do shoot gallery-small-$page gallery-small-$page top light; done
          for page in 1 2 3 4 5 6 7 8; do shoot gallery-medium-$page gallery-medium-$page top light; done
          for page in 1 2 3 4 5; do shoot gallery-large-$page gallery-large-$page top light; done
          for page in 1 2; do shoot gallery-lock-$page gallery-lock-$page top light; done
          shoot gallery-circular-1 gallery-circular-1 top light
          for screen in home spaces gallery-small-1; do shoot $screen $screen top dark; done
          for screen in home store space-nutrition space-budget; do shoot $screen-end $screen bottom light; done
          for screen in store spaces; do shoot $screen-mid $screen center light; done
          # Home Screen setups (Store) and app styles.
          for scheme in light dark; do
            shoot launch launch top $scheme
            shoot onboarding onboarding top $scheme
            shoot setups setups top $scheme
          done
          shoot setups-free setups-free top light
          shoot setups-end setups bottom light
          for setup in aurore creme neon; do shoot setup-$setup setup-$setup top light; done
          shoot gallery-setups-home gallery-setups-home top light
          shoot gallery-setups-lock gallery-setups-lock top light
          i=0
          for style in tessera ocean coral lavender sand graphite forest rose midnight neon; do
            if [ $((i % 2)) -eq 0 ]; then scheme=light; else scheme=dark; fi
            shoot style-$style home top $scheme -screenshotStyle $style
            i=$((i + 1))
          done
          shoot creator-nutrition creator-nutrition top light
          shoot creator-fitness-multi creator-fitness top light -screenshotCreatorMulti YES
          shoot creator-budget-dark creator-budget top dark
          shoot mywidgets-select mywidgets-select top light
          shoot mywidgets-fusion mywidgets-fusion top light
          shoot mywidgets-end mywidgets bottom light
          shoot creator-nutrition-medium creator-nutrition top light -screenshotCreatorFormat medium
          shoot creator-nutrition-large creator-nutrition top light -screenshotCreatorFormat large
          shoot creator-fitness-large creator-fitness center light -screenshotCreatorFormat large
          # First launch (personal steps), « Mes informations », the scanner fallback, per-widget settings.
          for step in identity interests sport nutrition money productivity; do
            shoot onboarding-$step onboarding-$step top light
          done
          shoot onboarding-sport-dark onboarding-sport top dark
          shoot home-info-dark home top dark
          shoot scan-food scan-food top light
          shoot creator-nutrition-content creator-nutrition center light -screenshotCreatorFormat medium
          shoot style-graphite-settings settings top dark -screenshotStyle graphite
          shoot style-sand-settings settings top dark -screenshotStyle sand
          shoot style-neon-store store top dark -screenshotStyle neon
          # The Store as a magazine, slice by slice, its pages, and Mes widgets as a carousel.
          for slice in 0.12 0.24 0.36 0.48 0.6 0.72 0.84; do shoot store-at-$slice store $slice light; done
          shoot store-dark store top dark
          shoot store-at-0.3-dark store 0.3 dark
          for page in combos packs collections collection-sport category-fitness; do shoot store-$page store-$page top light; done
          shoot store-combos-end store-combos bottom light
          shoot mywidgets-dark mywidgets top dark
          # Home as a dashboard (« Mon Quotidien »), « Mes informations », and a pack set widget by widget.
          shoot home-mid home center light
          shoot info info top light
          shoot info-dark info top dark
          for area in nutrition fitness student; do shoot info-$area info-$area top light; done
          WAIT=10 shoot pack-gym-setup pack-gym-setup top light
          studio_shots
          tutorial_shots
          app_shots
          # A new person (these clear the demo data, so they come last).
          shoot home-fresh home-fresh top light
          shoot editor-fresh editor-fresh top light
          shoot editor-fresh-data editor-fresh center light
          WAIT=10 shoot pack-nutrition-setup-fresh pack-nutrition-setup-fresh top light
          shoot info-fresh info-fresh top light
          WAIT=7 shoot app-nutrition-fresh app-nutrition-fresh top light

      - name: App Store screenshots
        id: marketing
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.MARKETING == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p marketing
          exec > >(tee marketing/log.txt) 2>&1
          set -x
          APP=build/sim/Build/Products/Debug-iphonesimulator/Tessera.app
          xcrun simctl list devices | grep -E "Booted|$DEVICE"
          # A simulator sometimes never finishes booting: give up after 4 minutes and boot it again.
          if ! perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b; then
            xcrun simctl shutdown "$DEVICE"
            xcrun simctl boot "$DEVICE"
            perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b
          fi
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$DEVICE" "$APP"
          # The language of the App Store page (French unless MARKETING_LANG says otherwise).
          LANG_ARGS=(-AppleLanguages "(${MARKETING_LANG:-fr})" -AppleLocale "${MARKETING_LOCALE:-fr_CA}")
          # The first launch saves the demo data every scene reads.
          xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera "${LANG_ARGS[@]}" -screenshotScreen home
          sleep 8
          shot() { # file screen [extra launch arguments]
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.tessera 2>/dev/null
            xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera "${LANG_ARGS[@]}" -screenshotScreen "$2" "${@:3}"
            sleep 7
            xcrun simctl io "$DEVICE" screenshot --type=png "marketing/$1.png"
          }
          LINES=()
          while IFS= read -r line; do LINES+=("$line"); done < <(grep -vE '^[[:space:]]*(#|$)' scripts/marketing_scenes.txt)
          for line in "${LINES[@]}"; do
            read -r scene screen <<< "$line"
            if [ -n "$screen" ]; then
              # A phone with the real screen: the screen area white then black, for difference matting.
              shot "$scene-white" "marketing-$scene" -marketingScreen white
              shot "$scene-black" "marketing-$scene" -marketingScreen black
            else
              shot "$scene" "marketing-$scene"
            fi
          done
          # The real screens that go inside the phones. A screen captured before it is drawn is almost
          # empty (a white PNG of about 100 KB, a real screen is 800 KB or more): it is taken again.
          for screen in $(printf '%s\n' "${LINES[@]}" | awk 'NF > 1 { print $2 }' | sort -u); do
            for attempt in 1 2 3; do
              shot "screen-$screen" "$screen"
              [ "$(stat -f%z "marketing/screen-$screen.png")" -gt 300000 ] && break
              sleep 5
            done
          done
          # Not on the App Store page: screens to review with the captures.
          shot extra-icons icons
          sips -g pixelWidth -g pixelHeight marketing/hero.png

      - name: Release build (App Store configuration) without the test unlock
        id: release
        if: steps.sim.outcome == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
          # Proof that the test unlock is not in the App Store build: neither its code nor its settings key.
          APP=build/release/Build/Products/Release-iphonesimulator/Tessera.app
          FOUND=0
          for bin in "$APP/Tessera" "$APP/PlugIns/TesseraWidgets.appex/TesseraWidgets"; do
            if strings -a "$bin" | grep -E "DebugPremium|debugPremiumDisabled|ScreenshotMode|WidgetGalleryView|SetupGalleryView|MarketingView"; then FOUND=1; fi
          done
          echo "test unlock found in Release binaries: $FOUND" | tee release-check.txt
          [ "$FOUND" = "0" ]

      - name: Publish build report
        if: always()
        run: |
          mkdir -p report
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "static: ${{ steps.static.outcome }}"
            echo "simulator: ${{ steps.sim.outcome }}"
            echo "device: ${{ steps.device.outcome }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo "ipa: ${{ (steps.device.outcome == 'success' && steps.tests.outcome != 'failure') && 'published' || 'not published' }}"
            echo "screenshots: ${{ steps.shots.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            echo "marketing: ${{ steps.marketing.outcome }}"
            cat release-check.txt 2>/dev/null || true
            echo "---- errors ----"
            python3 scripts/check_swift.py 2>&1 | tail -40 || true
            python3 scripts/l10n_catalog.py sync 2>&1 | tail -45 || true
            grep -hE "error:" sim.log device.log release.log 2>/dev/null | sort -u | head -500 || true
            echo "---- tests ----"
            grep -hE "Test Case .*(passed|failed)|error:|XCTAssert|TEST (SUCCEEDED|FAILED)" test.log 2>/dev/null | head -400 || true
            if [ -f stack-onone.log ]; then
              echo "---- stack check: unoptimized, 1 MB stack ----"
              grep -hE "Test Case .*(passed|failed)|crash|Crash|TEST (SUCCEEDED|FAILED)|EXC_|stack" stack-onone.log | head -40 || true
              echo "---- stack check: optimized (-O), 1 MB stack ----"
              grep -hE "BUILD (SUCCEEDED|FAILED)|error:" stack-build-o.log | head -10 || true
              grep -hE "Test Case .*(passed|failed)|crash|Crash|TEST (SUCCEEDED|FAILED)|EXC_|stack" stack-o.log | head -40 || true
            fi
            APPDIR=build/sim/Build/Products/Debug-iphonesimulator/Tessera.app
            echo "privacy manifest: app $([ -f $APPDIR/PrivacyInfo.xcprivacy ] && echo yes || echo MISSING), widget $([ -f $APPDIR/PlugIns/TesseraWidgets.appex/PrivacyInfo.xcprivacy ] && echo yes || echo MISSING)"
            echo "alternate app icons in the app: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons' $APPDIR/Info.plist 2>/dev/null | grep -c '= Dict')"
            echo "---- widget extension bundle ----"
            ls build/sim/Build/Products/Debug-iphonesimulator/Tessera.app/PlugIns/TesseraWidgets.appex 2>/dev/null || true
            ls build/sim/Build/Products/Debug-iphonesimulator/Tessera.app/PlugIns/TesseraWidgets.appex/Metadata.appintents 2>/dev/null || true
            grep -E "ExtractAppIntentsMetadata \(in target" sim.log 2>/dev/null | head -5 || true
            echo "---- last lines ----"
            tail -40 sim.log 2>/dev/null || true
          } > report/report.txt
          [ -d shots ] && cp shots/*.jpg report/ 2>/dev/null || true
          [ -d marketing ] && mkdir -p report/marketing && cp marketing/* report/marketing/ 2>/dev/null || true
          [ -d testshots ] && mkdir -p report/tests && cp testshots/* report/tests/ 2>/dev/null || true
          [ -d stackreports ] && mkdir -p report/stack && cp -R stackreports/* report/stack/ 2>/dev/null || true
          [ -f Tessera.ipa ] && cp Tessera.ipa report/ || true
          cd report
          git init -q
          git checkout -q -b ci-report
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report

      - name: Publish test build
        # No IPA when a test failed: a version with a known bug isn't handed out.
        if: steps.device.outcome == 'success' && steps.tests.outcome != 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          make_latest: true
          body: |
            Version de test de Tessera (build ${{ github.run_number }}).
            Installe `Tessera.ipa` sur ton iPhone avec Sideloadly (voir le README).
          files: |
            Tessera.ipa
            Tessera-diagnostic.ipa
