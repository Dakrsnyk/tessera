          # The app's mark (« T en creux ») where it appears: launch, first launch, Premium, Home Screen setups.
          brand_shots() {
            shoot brand-launch launch top light
            shoot brand-launch-dark launch top dark
            shoot brand-onboarding onboarding top light
            shoot brand-paywall paywall top light
            for setup in aurore creme neon; do shoot brand-setup-$setup setup-$setup top light; done
          }
          # The mini-apps opened from Home: each dashboard, then its pages.
          app_shots() {
            for screen in app-nutrition app-nutrition-meal app-nutrition-history app-nutrition-ideas app-nutrition-nutrients app-nutrition-saved; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-nutrition-end app-nutrition bottom light
            WAIT=7 shoot app-nutrition-history-end app-nutrition-history bottom light
            WAIT=7 shoot app-nutrition-dark app-nutrition top dark
            for screen in app-fitness app-fitness-session app-fitness-program app-fitness-library app-fitness-exercise app-fitness-history app-fitness-progress app-fitness-activity; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-fitness-end app-fitness bottom light
            WAIT=7 shoot app-fitness-exercise-end app-fitness-exercise bottom light
            WAIT=7 shoot app-fitness-session-end app-fitness-session bottom light
            for screen in app-planning app-planning-tasks app-planning-week app-planning-month app-planning-projects app-planning-habits app-planning-focus; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-planning-end app-planning bottom light
            WAIT=7 shoot app-planning-dark app-planning top dark
            for screen in app-studies app-studies-timetable app-studies-courses app-studies-course app-studies-exams app-studies-assignments app-studies-grades app-studies-revision; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-studies-end app-studies bottom light
            WAIT=7 shoot app-studies-course-end app-studies-course bottom light
            WAIT=7 shoot app-studies-revision-end app-studies-revision bottom light
            for screen in app-finances app-finances-transactions app-finances-categories app-finances-bills app-finances-savings app-finances-trends; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-finances-end app-finances bottom light
            WAIT=7 shoot app-finances-dark app-finances top dark
            for screen in app-business app-business-sales app-business-results app-business-recurring app-business-metrics; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-business-end app-business bottom light
            for screen in app-travel app-travel-program app-travel-budget app-travel-checklist; do
              WAIT=8 shoot $screen $screen top light
            done
            WAIT=8 shoot app-travel-end app-travel bottom light
            for screen in app-car app-car-fuel app-car-mileage app-car-maintenance app-car-deadlines app-car-costs; do
              WAIT=7 shoot $screen $screen top light
            done
            WAIT=7 shoot app-car-end app-car bottom light
            WAIT=10 shoot app-weather app-weather top light
            WAIT=10 shoot app-weather-end app-weather bottom light
            WAIT=10 shoot app-weather-dark app-weather top dark
            WAIT=8 shoot home-apps home 0.3 light
          }
          if [ "$LANGS" = "true" ]; then
            for pair in en:en_US de:de_DE ja:ja_JP es:es_MX it:it_IT pt-BR:pt_BR; do
              export SHOT_LANG=${pair%%:*} SHOT_LOCALE=${pair#*:}
