name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      # Tests and screenshots cost macOS minutes: only on a manual run or with [qa] in the commit message.
      QA: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]') || contains(github.event.head_commit.message, '[shots]') }}
      # [place] only builds for the simulator and runs the widget placement tests (cheapest check).
      PLACE: ${{ contains(github.event.head_commit.message, '[place]') }}
      # [check] only compiles for the simulator (fastest way to find compile errors).
      CHECK: ${{ contains(github.event.head_commit.message, '[check]') }}
      # [marketing] renders the App Store screenshots on a 6.9" iPhone (1320 x 2868).
      MARKETING: ${{ contains(github.event.head_commit.message, '[marketing]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Static checks (initializers, widget catalog, Release safety)
        id: static
        run: python3 scripts/check_swift.py

      - name: Boot a simulator early
        if: env.QA == 'true' || env.PLACE == 'true' || env.MARKETING == 'true'
        continue-on-error: true
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          if os.environ.get('MARKETING') == 'true':
              names = ['iPhone 17 Pro Max', 'iPhone 16 Pro Max', 'iPhone Air']
              preferred = [d for name in names for d in phones if d['name'] == name]
          else:
              preferred = [d for d in phones if d['name'] == 'iPhone 16 Pro'] or [d for d in phones if 'Pro' in d['name']]
          print((preferred or phones)[0 if os.environ.get('MARKETING') == 'true' else -1]['udid'])
          ")
          echo "Simulator: $(xcrun simctl list devices | grep $DEVICE)"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true

      - name: Build for the simulator
        id: sim
        if: steps.static.outcome == 'success'
        run: |
          set -o pipefail
          # Keep compiling the other files and targets after an error, so one run lists every error.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee sim.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Build for iPhone (unsigned)
        id: device
        if: steps.sim.outcome == 'success' && env.PLACE != 'true' && env.CHECK != 'true' && env.MARKETING != 'true'
        run: |
          set -o pipefail
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_DEBUG_DYLIB=NO build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log

      - name: Package IPA
        if: steps.device.outcome == 'success'
        run: |
          APP=build/device/Build/Products/Debug-iphoneos/Tessera.app
          # Ad-hoc signature carrying the entitlements, so sideloading tools keep the App Group.
          codesign --force --sign - --entitlements Config/TesseraWidgets.entitlements "$APP/PlugIns/TesseraWidgets.appex"
          codesign --force --sign - --entitlements Config/Tessera.entitlements "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tessera.ipa Payload
          ls -lh Tessera.ipa

      - name: Tests (logic and widget placement)
        id: tests
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && (env.QA == 'true' || env.PLACE == 'true')
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$DEVICE" -b
          ONLY=""
          if [ "$PLACE" = "true" ] && [ "$QA" != "true" ]; then ONLY="-only-testing:TesseraUITests"; fi
          xcodebuild test -project Tessera.xcodeproj -scheme Tessera -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath TestResults.xcresult \
            $ONLY ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)" || true
          mkdir -p testexport testshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path testexport || true
          python3 - <<'PY'
          import json, os, shutil
          manifest = os.path.join("testexport", "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                      # Skip the automatic recordings and event images: large and not useful here.
                      if item["exportedFileName"].endswith(".mp4") or name.startswith(("Screen Recording", "Synthesized Event", "UI Snapshot")):
                          continue
                      name = name.split("_0_")[0].replace(" ", "-")
                      ext = os.path.splitext(item["exportedFileName"])[1] or ".png"
                      shutil.copy(os.path.join("testexport", item["exportedFileName"]), os.path.join("testshots", name + ext))
          PY
          # What the widget extension logged while the system rendered it, and any crash report.
          xcrun simctl spawn "$DEVICE" log show --last 25m --style compact --info --debug \
            --predicate 'process == "TesseraWidgets" OR (process == "chronod" AND messageType == error) OR eventMessage CONTAINS[c] "Returned view collection"' \
            2>&1 | tail -6000 > testshots/widget-log.txt || true
          grep -E "com.dakrsnyk.tessera.widgets:timeline|watchdog|rror" testshots/widget-log.txt | tail -300 > testshots/widget-summary.txt || true
          find ~/Library/Logs/DiagnosticReports -iname "*Tessera*" -mmin -40 -exec cp {} testshots/ \; 2>/dev/null || true
          ls testshots
          grep -q "TEST SUCCEEDED" test.log

      - name: Screenshots
        id: shots
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.QA == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/Tessera.app
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          shoot() { # name screen scroll scheme
            xcrun simctl ui "$DEVICE" appearance $4
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.tessera 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera -screenshotScreen $2 -screenshotScroll $3
            sleep 5
            xcrun simctl io "$DEVICE" screenshot --type=jpeg "shots/$1-$4.jpg"
          }
          for screen in home spaces store editor-v2 paywall settings mywidgets space-nutrition space-fitness space-budget space-business space-student space-travel space-car space-productivity space-investing space-markets space-life; do
            shoot $screen $screen top light
          done
          for page in 1 2 3 4 5 6; do shoot gallery-small-$page gallery-small-$page top light; done
          for page in 1 2 3 4 5 6 7 8; do shoot gallery-medium-$page gallery-medium-$page top light; done
          for page in 1 2 3 4 5; do shoot gallery-large-$page gallery-large-$page top light; done
          for page in 1 2; do shoot gallery-lock-$page gallery-lock-$page top light; done
          shoot gallery-circular-1 gallery-circular-1 top light
          for screen in home spaces gallery-small-1; do shoot $screen $screen top dark; done
          for screen in home store space-nutrition space-budget; do shoot $screen-end $screen bottom light; done

      - name: App Store screenshots
        id: marketing
        if: steps.sim.outcome == 'success' && env.DEVICE != '' && env.MARKETING == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/Tessera.app
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p marketing
          # The first launch saves the demo data every scene reads.
          xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera -screenshotScreen home
          sleep 8
          for n in 01 02 03 04 05 06 07 08 09 10; do
            xcrun simctl terminate "$DEVICE" com.dakrsnyk.tessera 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.dakrsnyk.tessera -screenshotScreen marketing-$n
            sleep 7
            xcrun simctl io "$DEVICE" screenshot --type=png "marketing/$n.png"
          done
          sips -g pixelWidth -g pixelHeight marketing/01.png || true

      - name: Release build (App Store configuration) without the test unlock
        id: release
        if: steps.sim.outcome == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Tessera.xcodeproj -scheme Tessera -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
          # Proof that the test unlock is not in the App Store build: neither its code nor its settings key.
          APP=build/release/Build/Products/Release-iphonesimulator/Tessera.app
          FOUND=0
          for bin in "$APP/Tessera" "$APP/PlugIns/TesseraWidgets.appex/TesseraWidgets"; do
            if strings -a "$bin" | grep -E "DebugPremium|debugPremiumDisabled|ScreenshotMode|WidgetGalleryView|MarketingView"; then FOUND=1; fi
          done
          echo "test unlock found in Release binaries: $FOUND" | tee release-check.txt
          [ "$FOUND" = "0" ]

      - name: Publish build report
        if: always()
        run: |
          mkdir -p report
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "static: ${{ steps.static.outcome }}"
            echo "simulator: ${{ steps.sim.outcome }}"
            echo "device: ${{ steps.device.outcome }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo "screenshots: ${{ steps.shots.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            echo "marketing: ${{ steps.marketing.outcome }}"
            cat release-check.txt 2>/dev/null || true
            echo "---- errors ----"
            python3 scripts/check_swift.py 2>&1 | tail -40 || true
            grep -hE "error:" sim.log device.log release.log 2>/dev/null | sort -u | head -500 || true
            echo "---- tests ----"
            grep -hE "Test Case .*(passed|failed)|error:|XCTAssert|TEST (SUCCEEDED|FAILED)" test.log 2>/dev/null | head -120 || true
            echo "---- widget extension bundle ----"
            ls build/sim/Build/Products/Debug-iphonesimulator/Tessera.app/PlugIns/TesseraWidgets.appex 2>/dev/null || true
            ls build/sim/Build/Products/Debug-iphonesimulator/Tessera.app/PlugIns/TesseraWidgets.appex/Metadata.appintents 2>/dev/null || true
            grep -E "ExtractAppIntentsMetadata \(in target" sim.log 2>/dev/null | head -5 || true
            echo "---- last lines ----"
            tail -40 sim.log 2>/dev/null || true
          } > report/report.txt
          [ -d shots ] && cp shots/*.jpg report/ 2>/dev/null || true
          [ -d marketing ] && mkdir -p report/marketing && cp marketing/*.png report/marketing/ 2>/dev/null || true
          [ -d testshots ] && mkdir -p report/tests && cp testshots/* report/tests/ 2>/dev/null || true
          [ -f Tessera.ipa ] && cp Tessera.ipa report/ || true
          cd report
          git init -q
          git checkout -q -b ci-report
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report

      - name: Publish test build
        if: steps.device.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          make_latest: true
          body: |
            Version de test de Tessera (build ${{ github.run_number }}).
            Installe `Tessera.ipa` sur ton iPhone avec Sideloadly (voir le README).
          files: Tessera.ipa
