/* ======================= 12 · VITRAIL : jetons ======================= */
body.s12 { --board: #EDEBE4; --bink: #16181D; --bink2: #50555F;

  --sb-bg: #FAFAF7; --sb-ink: #16181D; --frame: #121417; --sw: 1.9; --edge-h: 0px;
  --c-nut: #F6B25C; --c-fit: #F0706F; --c-pla: #7FA6F8; --c-hab: #8CCB6B; --c-bud: #5CC7AE; --c-pro: #D9DCE3; --c-pas: #6FD3E0;

  --lg-r: 20px; --lg-rule: rgba(22,24,29,.14);
  --cg: "Century Gothic", "Avenir Next", Inter, sans-serif; }

/* ---------- composants Vitrail : la tuile de couleur pleine ---------- */
.s12 .scr { padding: 0 6px; }
.s12 .x-top { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 10px; }

.s12 .x-title { font-family: var(--cg); font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.12; padding: 0 10px; }

.s12 .x-t .u-dots > span.is-today > i { border-color: var(--ink); }

.s12 .x-t .u-spark .d { fill: var(--tile); }

.s12 .x-t .u-bars .goal { border-top-color: var(--ink); }
.s12 .x-stack { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; }
.s12 .x-g2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 6px; }
.s12 .x-g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.s12 .x-th { display: flex; align-items: center; gap: 8px; height: 30px; }
.s12 .x-th > i { font-size: 20px; }

.s12 .x-s { font-size: 12.5px; line-height: 1.35; font-weight: 500; }

.s12 .x-link { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.s12 .x-rgw { position: relative; flex: none; }

.s12 .x-mac { display: grid; gap: 7px; flex: 1; min-width: 0; }

/* événements : blocs clairs à barre d'encre ; la séance est pleine encre (la forme, pas la couleur, distingue le type) */

.s12 .x-chk { width: 24px; height: 24px; flex: none; font-size: 24px; }
.s12 .x-li.done b { text-decoration: line-through; font-weight: 600; }
.s12 .x-rest { display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 2px var(--ink); padding: 0 4px 0 16px; }

.s12 .x-pz { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); display: grid; place-items: center; font-size: 16px; --sw: 2.4; }
