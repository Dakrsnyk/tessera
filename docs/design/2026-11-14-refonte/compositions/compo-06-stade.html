<!doctype html>
<html lang="fr">
<head>

<title>Ardane — compositions d'accueil · 06 Stade</title>
<!-- Compositions d'accueil, style 06 Stade : n'utilise que compo-base.css / compo-base.js + le CSS propre à Stade ci-dessous.
     Rendu : 1400 × 2010, échelle 2. Contrôles : ?check (textes coupés en rouge), ?w375, ?measure. -->
<link rel="stylesheet" href="compo-base.css">
<style>
/* ======================= 06 · STADE : jetons ======================= */
body.s6 { --board: #050506; --bink: #FFFFFF; --bink2: #A4A4AB;
  --bg: #0A0A0B; --surface: #151517; --ink: #FFFFFF; --ink2: #8E8E94; --rule: #26262A; --primary: #17B3D0; --on-primary: #0A0A0B;
  --track: #2E2E33; --grid: #232327; --frame: #2A2A2E;
  --acc2: #FF3B4E; --ft: Bahnschrift, "Arial Narrow", sans-serif;
  --c-nut: #FF8A1F; --c-fit: #FF3B4E; --c-pla: #3D8BFF; --c-hab: #7FD13B; --c-bud: #19D3A2; --c-pro: #A0A0A8; --c-pas: #17B3D0;
  --c-prot: #FF3B4E; --c-gluc: #D4FF3A; --c-lip: #3D8BFF;
  --ev-travail: #8C6BFF; --ev-rdv: #FF6FB5; --ev-fill: 32%; --ev-r: 2px; --ev-bar: 3px; --wk-now: #FF3B4E; --wk-today: rgba(23,179,208,.10);
  --meter-r: 0; --meter-h: 6px; --bar-r: 0; --bars-gap: 4px; --bar-past: .6; --ring-cap: butt; --sw: 2.2; --edge-h: 100px;
  --lg-bg: #151517; --lg-rule: #26262A; --lg-r: 8px; }
.s6 .cb-head .num { font: 700 56px/0.9 var(--ft); font-stretch: 75%; color: var(--primary); transform: skewX(-8deg); }
.s6 .cb-head h1 { font: 700 44px/0.95 var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0; transform: skewX(-8deg); transform-origin: left bottom; }
.s6 .cb-head p { color: var(--bink2); }
.s6 .cb-head .badge { border-color: #3A3A40; color: var(--bink2); border-radius: 4px; }
.s6 .cb-cap b, .s6 .cb-cap span { font-family: var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: .02em; }
.s6 .cb-cap b { color: var(--primary); }
.s6 .lg-h { font: 700 30px/1 var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0; }
.s6 .lg-row .n { font: 700 17px var(--ft); font-stretch: 75%; text-transform: uppercase; }
.s6 .lg-row .k { font: italic 700 19px var(--ft); font-stretch: 75%; color: var(--primary); }

/* ---------- composants Stade ---------- */
.s6 .scr { padding: 0 16px; }
.s6 .cond { font-family: var(--ft); font-stretch: 75%; font-weight: 700; text-transform: uppercase; }
.s6 .sk { display: inline-block; transform: skewX(-8deg); transform-origin: left bottom; }
.s6 .top { display: flex; justify-content: space-between; align-items: center; height: 44px; }
.s6 .date { font: 800 12px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--primary); }
.s6 .ava { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #3A3A40; display: grid; place-items: center; font: 700 19px var(--ft); }
.s6 .kick { font: 800 11px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
.s6 .title { font-size: 52px; line-height: .9; margin: 8px 0 12px; }
.s6 .stack { display: grid; gap: 10px; }
.s6 .g2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.s6 .card { background: var(--surface); border-radius: 8px; border-left: 4px solid var(--c); position: relative; }
.s6 .cd { padding: 11px 14px 13px 14px; }
.s6 .hc { padding: 11px 12px 12px 13px; display: flex; flex-direction: column; }
.s6 .ch { display: flex; align-items: center; gap: 7px; height: 26px; }
.s6 .ch .no { font: italic 700 21px var(--ft); font-stretch: 75%; color: var(--c); min-width: 22px; }
.s6 .ch > i[data-i] { font-size: 18px; color: var(--c); }
.s6 .ch b { font-size: 19px; line-height: 1; white-space: nowrap; }
.s6 .ch .go, .s6 .go { margin-left: auto; font-size: 16px; color: var(--ink2); }
.s6 .pg { display: flex; gap: 3px; margin-left: 6px; }
.s6 .pg i { width: 9px; height: 4px; background: #3A3A40; transform: skewX(-20deg); }
.s6 .pg i.on { width: 18px; background: var(--primary); }
.s6 .nb { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; background: var(--primary); color: var(--on-primary); font: 800 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; margin-left: auto; }
.s6 .cap { font: 800 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.s6 .s { font-size: 12.5px; line-height: 1.35; font-weight: 500; color: var(--ink2); }
.s6 .big { white-space: nowrap; line-height: .85; font-variant-numeric: tabular-nums; }
.s6 .big small { font-size: .46em; color: var(--ink2); margin-left: 2px; }
.s6 .btnP { height: 48px; border-radius: 6px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 20px var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.s6 .btnS { height: 44px; border-radius: 6px; border: 1.5px solid var(--ink); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 18px var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: .04em; padding: 0 14px; white-space: nowrap; }
.s6 .btnP i, .s6 .btnS i { font-size: 18px; --sw: 2.6; }
.s6 .chip { display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid #3A3A40; font: 700 17px var(--ft); font-stretch: 75%; text-transform: uppercase; letter-spacing: .04em; color: #C9C9CF; white-space: nowrap; }
.s6 .link { font-size: 13px; font-weight: 600; color: var(--primary); }
.s6 .lab { display: flex; justify-content: space-between; align-items: baseline; font: 800 11px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); margin: 14px 0 7px; }
.s6 .lab a, .s6 .lab em { font-style: normal; color: var(--ink); letter-spacing: .08em; }
/* barres de score segmentées */
.s6 .sg { display: flex; gap: 3px; height: 6px; }
.s6 .sg i { flex: 1; background: var(--track); transform: skewX(-20deg); }
.s6 .sg i.f { background: var(--c); }
.s6 .sg.t { height: 8px; }
.s6 .u-hab { --hab: 24px; --hab-gap: 5px; }
.s6 .u-hab > span, .s6 .u-dots > span > i { border-radius: 3px; transform: skewX(-8deg); border-width: 1.5px; border-color: #3A3A40; }
.s6 .u-hab > span.is-done { color: var(--on-primary); --on-c: var(--on-primary); }
.s6 .u-dots { --dot: 18px; }
.s6 .u-hab i { --sw: 3; }
.s6 .u-spark .d { fill: var(--surface); }
.s6 .u-spark .a { opacity: .14; }
.s6 .mac { display: grid; gap: 7px; align-content: center; }
.s6 .mac > div { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 13px; }
.s6 .mac span { font: 800 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.s6 .mac em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; }
.s6 .mac .sg { grid-column: 1 / -1; height: 5px; }
/* lisières de couloir (listes sur fond) */
.s6 .lane { display: grid; grid-template-columns: 34px 24px 1fr auto; align-items: center; gap: 8px; min-height: 46px; border-bottom: 1px solid var(--rule); }
.s6 .lane .n { font: italic 700 23px var(--ft); font-stretch: 75%; color: var(--c); }
.s6 .lane i { font-size: 19px; color: var(--c); }
.s6 .lane b { font-size: 21px; line-height: 1; }
.s6 .lane .r { font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.s6 .ls > .li { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 0; border-bottom: 1px solid var(--rule); }
.s6 .ls > .li:last-child { border-bottom: 0; }
.s6 .li > .tx { min-width: 0; flex: 1; }
.s6 .li b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
.s6 .li .s { display: block; }
.s6 .li .r { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.s6 .li > i[data-i]:first-child { font-size: 22px; color: var(--c); }
.s6 .tm { width: 58px; font: italic 700 24px var(--ft); font-stretch: 75%; flex: none; }
.s6 .evb { width: 4px; height: 30px; background: var(--c); flex: none; }
.s6 .chk { width: 24px; height: 24px; flex: none; font-size: 24px; color: var(--ink2); }
.s6 .chk.ok { color: var(--primary); }
.s6 .li.done b { text-decoration: line-through; color: var(--ink2); font-weight: 500; }
.s6 .li .dn { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
/* barre d'onglets */
.s6 .tabbar { background: var(--bg); border-top: 1px solid var(--rule); }
.s6 .ti { position: relative; padding-top: 9px; font: 800 11px Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #8E8E94; }
.s6 .ti.on { color: #fff; }
.s6 .ti.on i { color: var(--primary); }
.s6 .ti.on::before { content: ""; position: absolute; top: -1px; left: 50%; margin-left: -15px; width: 30px; height: 3px; background: var(--primary); }

/* ---------- carte « Maintenant » (B, E) ---------- */
.s6 .nowc { background: var(--surface); border-radius: 8px; border-left: 4px solid var(--c); padding: 13px 14px 14px 16px; }
.s6 .nk { display: flex; align-items: center; gap: 8px; font: 800 11px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
.s6 .nk .nb { margin-left: auto; letter-spacing: .1em; }
.s6 .live { width: 9px; height: 9px; border-radius: 50%; background: var(--acc2); flex: none; }
.s6 .ng { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end; margin: 8px 0 12px; }
.s6 .ng b { display: block; font-size: 28px; line-height: .95; }
.s6 .ng .m { display: block; font: 800 11px Inter, sans-serif; letter-spacing: .1em; color: var(--ink2); margin-top: 7px; text-transform: uppercase; }
.s6 .setbar { display: flex; gap: 4px; margin-bottom: 12px; }
.s6 .setbar i { flex: 1; height: 6px; background: var(--track); transform: skewX(-20deg); }
.s6 .setbar i.f { background: var(--c); }
.s6 .setbar i.c { background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 9px); }
.s6 .rest { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.s6 .rest .t { font-size: 38px; line-height: .9; }
.s6 .rest .pz { margin-left: auto; width: 48px; height: 44px; border-radius: 6px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 20px; --sw: 2.6; }
/* tableau de score : chiffres sous une lisière */
.s6 .score { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.s6 .score > div { border-top: 3px solid var(--c); padding-top: 7px; min-width: 0; }
.s6 .score b { display: block; font-size: 38px; line-height: 1; white-space: nowrap; }
.s6 .score b small { font-size: .5em; color: var(--ink2); }
.s6 .score .cap { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .05em; }

/* ---------- A · Équilibrée ---------- */
.s6 .nutA { display: grid; grid-template-columns: 124px 1fr; gap: 12px; align-items: center; margin: 4px 0 8px; }
.s6 .nutA .bn .n { font-size: 54px; }
.s6 .nutA .bn .cap { display: block; margin-top: 6px; }
.s6 .nf { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }
.s6 .A .hc .h3 { font-size: 28px; line-height: .95; margin-top: 3px; }
.s6 .A .hc .btnP { margin-top: auto; }
.s6 .A .wkA { --wk-h: 74px; --wk-gutter: 0px; --wk-gap: 2px; --wk-head: 16px; margin: 8px 0 8px; }
.s6 .A .wkA .gut, .s6 .A .wkA .u-week > span:first-child { display: none; }
.s6 .A .wkA .u-week { grid-template-columns: var(--wk-cols); }

/* ---------- B ---------- */
.s6 .B .title { font-size: 40px; margin: 4px 0 10px; }
.s6 .B .lane { min-height: 42px; }
.s6 .B .lab { margin: 12px 0 5px; }
.s6 .B .setbar { margin-bottom: 10px; }
.s6 .B .ng { margin: 6px 0 10px; }
.s6 .B .rest { margin-bottom: 8px; }

/* ---------- C · Éditoriale ---------- */
.s6 .C .title { font-size: 54px; margin: 6px 0 8px; }
.s6 .lead { font-size: 19px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; margin: 0 0 11px; text-wrap: pretty; }
.s6 .lead b { font-weight: 800; color: var(--primary); }
.s6 .duo { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 10px; }
.s6 .duo .card.hc { justify-content: space-between; }
.s6 .duo .n { font-size: 60px; }
.s6 .duo .col { display: grid; gap: 10px; }
.s6 .mini { padding: 8px 12px 9px 13px; }
.s6 .mini .cap { display: flex; align-items: center; gap: 6px; }
.s6 .mini .no { font: italic 700 19px var(--ft); font-stretch: 75%; color: var(--c); letter-spacing: 0; }
.s6 .mini .mr { display: flex; align-items: flex-end; gap: 10px; margin-top: 4px; }
.s6 .mini .s { font-size: 12px; line-height: 1.25; padding-bottom: 1px; }
.s6 .mini .n { display: block; font-size: 32px; line-height: .95; margin: 4px 0 3px; }
.s6 .wkC { --wk-h: 142px; --wk-gutter: 20px; --wk-head: 20px; --ev-fs: 11px; margin-top: 8px; }
.s6 .C .bb { height: 40px; margin-top: 6px; }
.s6 .C .u-bars-lab { margin: 4px 0 4px; }

/* ---------- D · Compacte ---------- */
.s6 .D .title { font-size: 38px; margin: 4px 0 8px; }
.s6 .cells { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.s6 .cell { height: 78px; padding: 8px 8px 8px 10px; background: var(--surface); border-left: 3px solid var(--c); border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.s6 .cell .v { font-size: 32px; line-height: .9; white-space: nowrap; }
.s6 .cell .v small { font-size: .46em; color: var(--ink2); }
.s6 .cell .cap { font-size: 11px; letter-spacing: .06em; line-height: 1.15; }
.s6 .D .lab { margin: 10px 0 4px; }
.s6 .D .ls > .li { min-height: 44px; padding: 3px 0; }
.s6 .D .li b { font-size: 14.5px; }
.s6 .D .li .s { font-size: 12px; }
.s6 .D .btnP { height: 44px; padding: 0 12px; font-size: 17px; }
.s6 .D .fit { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; }
.s6 .D .fit .h3 { font-size: 22px; line-height: .95; white-space: nowrap; }
.s6 .D .fit .s { display: block; margin-top: 3px; white-space: nowrap; }
.s6 .D .cell { height: 82px; }
.s6 .D .ls > .li { min-height: 48px; }
.s6 .D .fit { min-height: 62px; }

/* ---------- E · Premium ---------- */
.s6 .E .title { font-size: 42px; margin: 4px 0 10px; }
.s6 .dom { background: var(--surface); border-radius: 8px; border-left: 6px solid var(--c); padding: 12px 16px 14px 16px; }
.s6 .dom h2 { font-size: 38px; line-height: .9; margin-top: 12px; }
.s6 .dom .m { display: block; font: 800 11.5px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); margin-top: 9px; }
.s6 .dom .setbar { margin: 12px 0 12px; }
.s6 .dom .tmr { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 10px; margin-bottom: 12px; }
.s6 .dom .tmr b { display: block; font-size: 66px; line-height: .8; margin-top: 6px; }
.s6 .dom .pz { width: 56px; height: 48px; border-radius: 6px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 22px; --sw: 2.6; }
.s6 .E .hc .n { font-size: 56px; margin-top: 8px; }
.s6 .band { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
.s6 .band > div { border-top: 3px solid var(--c); padding: 7px 0 12px; min-width: 0; }
.s6 .band .cap { letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.s6 .band .cap i { font-size: 15px; color: var(--c); }
.s6 .band b { display: block; font-size: 36px; line-height: .95; margin-top: 6px; white-space: nowrap; }
.s6 .band b small { font-size: .5em; color: var(--ink2); }
.s6 .band .s { display: block; margin-top: 4px; }
.s6 .band .sg { margin-top: 6px; }
</style>
</head>
<body class="s6">
<main class="cb">
  <header class="cb-head"><div class="num">06</div><div><h1>Stade · cinq accueils complets</h1><p>Le tableau d'affichage d'un stade : chiffres géants penchés, couloirs numérotés, barres de score, action en pleine largeur. Cyan pour agir, rouge pour « en cours », couleur de catégorie en lisière.</p></div><span class="badge">Maquette d'idée · données d'exemple</span></header>
