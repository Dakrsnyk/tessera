<style>
/* ======================= 13 · SELLIER : jetons ======================= */
body.s13 { --board: #EDE6DA; --bink: #2B1D14; --bink2: #6A5646;
  --bg: #F5F0E8; --surface: #FFFDF8; --ink: #2B1D14; --ink2: #75614F; --rule: #D9CBB8; --primary: #C24E12; --on-primary: #FFFFFF;
  --track: #E6DCCB; --grid: #E8DFD0; --seam: #CDBBA2; --brass: #A8843F;
  --c-nut: #B5651D; --c-fit: #9E3B32; --c-pla: #3F5E8C; --c-hab: #5F7A3A; --c-bud: #2F6F62; --c-pro: #75614F; --c-pas: #3B7480;
  --c-prot: #9E3B32; --c-gluc: #8A6A12; --c-lip: #3F5E8C;
  --ev-travail: #6A4F8C; --ev-rdv: #8B3A62; --ev-fill: 20%; --ev-r: 3px; --wk-now: var(--ink);
  --ser: "Baskerville Old Face", Baskerville, Georgia, serif; --gil: "Gill Sans MT", "Gill Sans", Inter, sans-serif;
  --r: 10px; --sw: 1.8; --edge-h: 0px; --frame: #2B1D14; --lg-bg: #FFFDF8; --lg-rule: #D9CBB8; --lg-r: 10px; --bars-gap: 5px; --bar-r: 2px; }

/* ---------- composants Sellier ---------- */
.s13 .scr { padding: 0 18px; }
.s13 .xtop { display: flex; justify-content: space-between; align-items: center; height: 44px; }
.s13 .xdate { font: 650 12px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }

.s13 .xk { font: 700 12px var(--gil); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); margin-top: 2px; }
.s13 .xt { font: 400 38px/1.1 var(--ser); color: var(--ink); letter-spacing: -.005em; }
.s13 .xrule { height: 1px; background: var(--brass); margin: 7px 0 11px; }
.s13 .xc { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); position: relative; }
.s13 .xc::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--seam); border-radius: 6px; pointer-events: none; }
.s13 .xp { padding: 16px 16px 16px; }
.s13 .xhc { padding: 15px 15px 14px; display: flex; flex-direction: column; }
.s13 .xg2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.s13 .xstack { display: grid; gap: 12px; }
.s13 .xh { display: flex; align-items: center; gap: 9px; height: 30px; position: relative; z-index: 1; }
.s13 .xi { width: 30px; height: 30px; border-radius: 8px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 17px; flex: none; }
.s13 .xl { font: 700 12.5px var(--gil); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.s13 .xgo { margin-left: auto; font-size: 16px; color: var(--ink2); }
.s13 .xpg { display: flex; gap: 4px; margin-left: 4px; }
.s13 .xpg i { width: 6px; height: 6px; border-radius: 3px; background: #CDBBA2; }
.s13 .xpg i.on { background: var(--primary); }
.s13 .xs { font: 400 12.5px/1.35 Inter, sans-serif; color: var(--ink2); }

.s13 .xh3 { font: 400 21px/1.15 var(--ser); color: var(--ink); }

.s13 .xbtn { height: 44px; border-radius: var(--r); background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 13px var(--gil); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; position: relative; z-index: 1; }

.s13 .xbtn2 { height: 44px; border-radius: var(--r); border: 1.5px solid var(--ink); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font: 700 13px var(--gil); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; position: relative; z-index: 1; }

.s13 .xpill { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--seam); font: 700 11.5px var(--gil); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.s13 .xlink { font: 700 12px var(--gil); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; position: relative; z-index: 1; }
/* étiquette de bagage */
.s13 .xtag { --hole: var(--surface); position: relative; display: inline-flex; align-items: center; height: 26px; padding: 0 9px 0 22px; background: var(--primary); color: #fff; font: 700 11px var(--gil); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;

/* barre d'onglets : bande de toile, point orange sous l'onglet actif */

/* ---------- A · Équilibrée ---------- */
.s13 .A .xnut { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 16px; align-items: center; margin: 6px 0 12px; position: relative; z-index: 1; }
