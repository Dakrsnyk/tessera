<style>
/* ======================= 4 · MAISON : jetons (repris de styles-01-05.html) ======================= */
body.s4 { --board: #E8E0D2; --bink: #1A1714; --bink2: #5B534A;
  --bg: #F6F1E9; --surface: #FBF8F2; --ink: #1A1714; --ink2: #6F675E; --rule: #D6CCBD; --primary: #1F3A5F; --on-primary: #F6F1E9;
  --accent: #B08D57; --mat: #EEE6D9; --track: #DDD3C3; --grid: #E6DDCD; --on-c: #F6F1E9;
  --c-nut: #9F7856; --c-fit: #B06D73; --c-pla: #5B6FA8; --c-hab: #638B4B; --c-bud: #4B8B78; --c-pro: #7A7589; --c-pas: #4A8C94;
  --c-prot: #B06D73; --c-gluc: #98782A; --c-lip: #5B6FA8;
  --ev-travail: #7B6A9E; --ev-rdv: #A5566F; --ev-fill: 16%; --ev-r: 1px; --ev-bar: 2px;
  --wk-now: #1F3A5F; --wk-today: rgba(31,58,95,.06);
  --sw: 1.25; --edge-h: 34px; --frame: #1A1714; --meter-h: 3px; --meter-r: 0px; --bar-r: 0px; --bar-past: .6; --ring-cap: butt;
  --lg-bg: #F6F1E9; --lg-rule: #D6CCBD; --lg-r: 2px;
  --serif: "Sitka Display", "Sitka Heading", Constantia, Georgia, serif; --text: "Sitka Text", Georgia, serif; }
.s4 .phone { box-shadow: 0 0 0 9px #1A1714, 0 22px 44px rgba(60,40,10,.22); }
.s4 .scr { padding: 0 24px; }
.s4 .lg-h, .s4 .cb-head h1 { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
.s4 .cb-head .num { font-family: var(--serif); font-weight: 400; }

/* ---------- lettres ---------- */
.s4 .sc { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.s4 .ser { font-family: var(--serif); font-weight: 400; font-variant-numeric: lining-nums; }
.s4 .it { font-family: var(--text); font-style: italic; }
.s4 .s { font-size: 12.5px; line-height: 1.38; color: var(--ink2); }

/* ---------- en-tête ---------- */
.s4 .top { display: flex; justify-content: space-between; align-items: center; height: 44px; }
.s4 .date { font-family: var(--text); font-style: italic; font-size: 15.5px; color: var(--primary); }

.s4 .title { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: 42px; line-height: 1.1; }
.s4 .gold { width: 34px; height: 1px; background: var(--accent); margin: 8px auto 14px; }

/* ---------- cadre, point, libellé ---------- */

.s4 .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--primary); border-radius: 1px; color: var(--primary); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; align-self: flex-start; }
.s4 .btnP { height: 44px; padding: 0 16px; border-radius: 2px; background: var(--primary); color: var(--bg); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.s4 .btnP i { font-size: 14px; --sw: 1.8; }
.s4 .btnS { height: 44px; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }

/* carnet à deux colonnes */
.s4 .carnet { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); border-top: 1px solid var(--ink); }
.s4 .carnet > div { padding: 12px 0 11px; border-bottom: 1px solid var(--rule); min-width: 0; }
.s4 .carnet > div:nth-child(odd) { padding-right: 14px; border-right: 1px solid var(--rule); }
.s4 .carnet > div:nth-child(even) { padding-left: 14px; }
.s4 .carnet .n { font-family: var(--serif); font-size: 30px; line-height: 1.05; font-variant-numeric: lining-nums; display: block; margin-top: 5px; white-space: nowrap; }
.s4 .carnet .n small { font-family: var(--serif); font-size: 18px; color: var(--ink2); }
.s4 .carnet .s { display: block; margin-top: 3px; }
.s4 .cl { display: flex; align-items: center; gap: 7px; }

/* mini-apps en cercles fins */
.s4 .rounds { display: grid; grid-template-columns: repeat(4, 1fr); }
.s4 .rd { text-align: center; }
.s4 .rd .ic { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 22px; position: relative; margin: 0 auto; }
.s4 .rd .ic::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--bg); }

.s4 .rd span { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); line-height: 1.3; margin-top: 2px; }

/* barre d'onglets */
.s4 .tabbar { background: var(--bg); border-top: 1px solid var(--rule); }
.s4 .ti { position: relative; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); gap: 5px; padding-top: 8px; }
.s4 .ti i { font-size: 21px; }
.s4 .ti.on { color: var(--ink); }

/* lignes de liste */

.s4 .li b { display: block; font-family: var(--serif); font-weight: 400; font-size: 17px; line-height: 1.15; }
.s4 .li .s { display: block; font-size: 12px; }
.s4 .li .r { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.s4 .chk { width: 24px; height: 24px; flex: none; font-size: 24px; color: var(--ink2); }
.s4 .chk.ok { color: var(--ink); }
.s4 .li.done b { text-decoration: line-through; color: var(--ink2); }
.s4 .tm { width: 48px; font-family: var(--serif); font-size: 18px; font-variant-numeric: lining-nums; flex: none; }
.s4 .evb { width: 2px; height: 28px; background: var(--c); flex: none; }

/* ---------- A ---------- */
.s4 .A .title { font-size: 36px; }
.s4 .A .gold { margin: 6px auto 12px; }
.s4 .nutA { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; margin: 6px 0 2px; }
.s4 .nf { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); margin-top: 6px; padding-top: 2px; }
.s4 .nf .sc { color: var(--ink); }
.s4 .A .hf .h3 { margin-top: 3px; }
.s4 .A .hf .btnP { margin-top: auto; }
.s4 .A .wkA { --wk-h: 70px; --wk-gutter: 0px; --wk-gap: 2px; --wk-head: 18px; margin: 8px 0 8px; }

/* ---------- B ---------- */
.s4 .B .title { font-size: 38px; }
.s4 .B .gold { margin: 6px auto 12px; }

.s4 .rest { height: 44px; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--rule); padding-left: 12px; }
.s4 .rest small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ink2); line-height: 1; }
.s4 .rest b { display: block; font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.05; font-variant-numeric: lining-nums; }
.s4 .rest .pz { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 17px; --sw: 1.8; flex: none; }

/* ---------- C ---------- */
.s4 .C .title { font-size: 48px; line-height: 1.05; }
.s4 .C .gold { margin: 6px auto 14px; }

.s4 .trio > div { padding: 11px 0 12px 10px; border-left: 1px solid var(--rule); min-width: 0; }

.s4 .trio .n em { font-style: normal; font-size: 22px; color: var(--ink2); }
.s4 .trio .s { display: block; font-size: 11.5px; margin-top: 3px; line-height: 1.3; }
.s4 .wkC { --wk-h: 160px; --wk-gutter: 22px; --wk-head: 20px; --ev-fs: 11px; margin-top: 8px; }
.s4 .C .bb { height: 48px; --bars-gap: 4px; margin-top: 10px; }
.s4 .C .u-bars-lab { --bars-gap: 4px; margin: 4px 0 5px; }

/* ---------- D ---------- */
.s4 .D .title { font-size: 34px; }
.s4 .D .gold { margin: 4px auto 8px; }

.s4 .btnW { height: 46px; margin-top: 13px; background: var(--bg); color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; border-radius: 2px; }

.s4 .E .g2 { margin-top: 12px; gap: 12px; }

<body class="s4">
<main class="cb">
  <header class="cb-head"><div class="num">04</div><div><h1>Maison · cinq accueils complets</h1><p>Une même journée, cinq façons de la montrer, dans la langue d'une maison de couture : papier ivoire, une encre, bleu nuit pour l'action, l'or en simple filet, un point de couleur par espace.</p></div><span class="badge">Maquette d'idée · données d'exemple</span></header>

  <div class="cb-grid">
