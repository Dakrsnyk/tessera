<!-- Planche des compositions, style Architecte : plan coté, filets noirs d'un point, rayon 0, aucune ombre, chiffres fins.

<style>
/* ======================= 2 · ARCHITECTE : jetons ======================= */
body.s2 { --board: #E4E2DD; --bink: #111111; --bink2: #55554F;
  --bg: #F2F1EE; --surface: #FFFFFF; --ink: #111111; --ink2: #5F5F58; --rule: #111111; --primary: #245B8F; --on-primary: #FFFFFF;
  --track: #111111; --grid: #CFCDC6; --wk-now: #111111; --wk-today: #E9E7E1;
  --c-nut: #926D4B; --c-fit: #AC5D64; --c-pla: #4C6A9C; --c-hab: #577E41; --c-bud: #42806D; --c-pro: #6B6B65; --c-pas: #3F7F8C;
  --c-prot: #AC5D64; --c-gluc: #8A7120; --c-lip: #4C6A9C;
  --ev-travail: #7A62B5; --ev-rdv: #A8517F; --ev-fill: 16%; --ev-r: 0px; --ev-bar: 3px;
  --bar-r: 0px; --bars-gap: 4px; --meter-r: 0px; --meter-h: 8px; --ring-cap: butt; --sw: 1.4;
  --frame: #111111; --edge-h: 0px; --lg-bg: #FFFFFF; --lg-rule: #111111; --lg-r: 0px; }
.s2 .phone { box-shadow: 0 0 0 9px #111, 0 22px 44px rgba(0,0,0,.18); }
.s2 .cb-head .badge { border-radius: 0; border-color: #111; color: #111; }
.s2 .tag { border-radius: 0; }

/* ---------- composants Architecte ---------- */
.s2 .scr { padding: 0; }
.s2 .hdr { height: 44px; display: flex; align-items: stretch; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.s2 .hdr .l { flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 20px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.s2 .hdr .l .d { color: var(--primary); }
.s2 .hdr .l .sep { width: 1px; height: 12px; background: var(--ink); }
.s2 .hdr .u { width: 52px; border-left: 1px solid var(--rule); display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.s2 .ttl { padding: 12px 20px 12px; border-bottom: 1px solid var(--rule); }
.s2 .kick { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); }
.s2 .title { font-size: 40px; font-weight: 300; letter-spacing: -.035em; line-height: 1.02; margin-top: 3px; }
.s2 .lab { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--rule); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.s2 .lab.w { padding: 0 20px; }
.s2 .lab > span:last-child { color: var(--ink2); display: flex; align-items: center; gap: 7px; font-weight: 600; }
.s2 .lab a { color: var(--primary); letter-spacing: .1em; }
.s2 .lab i[data-i] { font-size: 13px; color: var(--ink); }

.s2 .pg { display: inline-flex; gap: 3px; margin-right: 4px; }

.s2 .pg i.on { background: var(--ink); }

.s2 .g2 { display: grid; grid-template-columns: 1fr 1fr; }
.s2 .g2 > .cl + .cl { border-left: 1px solid var(--rule); }

.s2 .num small { font-size: .4em; font-weight: 400; letter-spacing: 0; color: var(--ink2); margin-left: 2px; }
.s2 .s { font-size: 12px; line-height: 1.35; color: var(--ink2); }
.s2 .s.k { color: var(--ink); font-weight: 600; }

.s2 .btnS { height: 44px; background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

.s2 .tag-m { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border: 1px solid var(--ink); font-size: 11px; font-weight: 600; background: var(--ink); color: #fff; white-space: nowrap; }

<body class="s2">
<main class="cb">
  <header class="cb-head"><div class="num">02</div><div><h1>Architecte · cinq accueils complets</h1><p>Un plan coté : chaque écran est une grille de cellules tracées au filet noir d'un point, chiffres fins, étiquettes en capitales numérotées. Les cinq mini-apps cohabitent ; la couleur de catégorie est un carré de 8 points.</p></div><span class="badge">Maquette d'idée · données d'exemple</span></header>

  <div class="cb-grid">

  <!-- ============================== A · ÉQUILIBRÉE (13:20) ============================== -->

    <div class="hdr"><div class="l"><span class="d">Jeu. 12 novembre</span><span class="sep"></span><span>13 h 20</span></div><div class="u">M</div></div>
    <div class="ttl"><div class="kick">Mon quotidien</div><div class="title">Ta journée</div></div>
    <section class="cl" data-c="nut">
      <div class="lab"><span>01 — Nutrition</span><span><span class="pg"><i class="on"></i><i></i><i></i></span><i class="sq"></i><i data-i="chev"></i></span></div>
      <div class="nutA">
        <div class="kc"><div class="num">1 122</div><div class="s">kcal restantes</div><div class="s tn">1 078 / 2 200 kcal</div><div data-u="meter" data-p=".49"></div></div>
        <div class="mac">
          <div data-c="prot"><span>Protéines</span><em>68/140 g</em><div data-u="meter" data-p=".486"></div></div>
          <div data-c="gluc"><span>Glucides</span><em>121/250 g</em><div data-u="meter" data-p=".484"></div></div>
          <div data-c="lip"><span>Lipides</span><em>34/70 g</em><div data-u="meter" data-p=".486"></div></div>
        </div>
      </div>
      <div class="nf"><div class="btnS"><i data-i="scan"></i>Scanner</div><div class="pl">2 repas</div></div>
    </section>
    <div class="g2">
      <section class="cl fit h144" data-c="fit">
