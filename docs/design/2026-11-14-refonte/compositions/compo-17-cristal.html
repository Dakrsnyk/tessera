<main class="cb">
  <header class="cb-head"><div class="num">17</div><div><h1>Cristal · cinq accueils complets</h1><p>Le verre ne sert qu'à ce qui flotte (barre du haut, carte « Maintenant », boutons groupés, onglets) ; le contenu reste sur des panneaux presque opaques. Une seule couleur d'action.</p></div><span class="badge">Maquette d'idée · données d'exemple</span></header>
