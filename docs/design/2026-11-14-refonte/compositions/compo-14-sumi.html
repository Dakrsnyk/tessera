.s14 .scr { padding: 0 20px 0 48px; }
.s14 .scr::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 1px; background: var(--line); }

.s14 .ytop { display: flex; justify-content: space-between; align-items: center; height: 42px; }
.s14 .yk { font: 600 12px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
.s14 .yava { width: 36px; height: 36px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 400 19px var(--ser); }
.s14 .yt { font: 400 42px/1 var(--ser); letter-spacing: -.01em; margin: 0 0 9px; }
.s14 .yhr { border-top: 1px solid var(--ink); }
.s14 .yh1 { border-top: 1px solid var(--rule); }
.s14 .ysec { padding: 9px 0 10px; }
.s14 .ylb { display: flex; align-items: center; gap: 7px; height: 24px; font: 600 13px Inter, sans-serif; color: var(--ink); letter-spacing: .01em; white-space: nowrap; }
.s14 .ylb i[data-i] { font-size: 18px; color: var(--c); }
.s14 .ylb i.go[data-i] { margin-left: auto; color: var(--ink2); font-size: 16px; }
.s14 .ylb .pg { display: flex; gap: 4px; margin-left: 4px; }
.s14 .ylb .pg u { width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--ink2); text-decoration: none; }
.s14 .ylb .pg u.on { background: var(--ink); border-color: var(--ink); }
.s14 .ygrid { display: grid; grid-template-columns: var(--cols, minmax(0,1fr) minmax(0,1fr)); }
.s14 .ygrid > div { min-width: 0; }
.s14 .ygrid > div + div { border-left: 1px solid var(--rule); padding-left: 14px; }
.s14 .ygrid > div:not(:last-child) { padding-right: 14px; }
.s14 .yn { font: 400 56px/.95 var(--ser); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.s14 .yn small { font: 400 24px var(--ser); color: var(--ink2); letter-spacing: 0; }

.s14 .yb2 { height: 44px; border-radius: 2px; border: 1px solid var(--ink); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font: 600 14px Inter, sans-serif; white-space: nowrap; }

.s14 .ylink { font: 600 12.5px Inter, sans-serif; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
.s14 .ypill { font: 600 12px Inter, sans-serif; color: var(--ink); white-space: nowrap; }
/* sceau */
.s14 .yseal { flex: none; width: 66px; height: 66px; border-radius: 50%; background: var(--verm); color: #fff; display: grid; place-items: center; position: relative; font: 400 12px var(--ser); }
.s14 .yseal::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); }

.s14 .yev { width: 2px; align-self: stretch; margin: 6px 0; background: var(--c); flex: none; }

</style>
