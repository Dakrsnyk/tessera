<style>
/* ======================= 1 · SAPHIR : jetons ======================= */
body.s1 { --board: #E6EAF0; --bink: #0B1220; --bink2: #4E5968;
  --bg: #F4F6FA; --surface: #FFFFFF; --ink: #0B1220; --ink2: #5E6979; --rule: #E3E8F0; --primary: #245B8F; --on-primary: #FFFFFF;

  --c-nut: #C36F25; --c-fit: #DF5661; --c-pla: #4385DB; --c-hab: #49961D; --c-bud: #1D9672; --c-pro: #79849A; --c-pas: #1E929F;
  --c-prot: #DF5661; --c-gluc: #A37F12; --c-lip: #4385DB;
  --ev-travail: #926FE4; --ev-rdv: #DD4DA1; --ev-fill: 16%;
  --r-card: 22px; --r-btn: 14px; --sw: 1.8; --edge-h: 112px; --wk-now: var(--ink); --frame: #121417; --lg-r: 22px; --lg-rule: #E3E8F0; }

/* ---------- composants Saphir ---------- */
.s1 .scr { padding: 0 20px; }
.s1 .top { display: flex; justify-content: space-between; align-items: center; height: 44px; }
.s1 .date { font-size: 15px; font-weight: 650; color: var(--primary); }

.s1 .kick { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ink2); margin-top: 2px; }
.s1 .title { font-size: 34px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.s1 .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 9px; }
.s1 .sec b { font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
.s1 .sec a { font-size: 15px; font-weight: 550; color: var(--primary); }
.s1 .card { background: var(--surface); border-radius: var(--r-card); box-shadow: 0 1px 2px rgba(11,18,32,.05), 0 6px 18px rgba(11,18,32,.05); position: relative; }

.s1 .ch b { font-size: 15px; font-weight: 650; white-space: nowrap; }

.s1 .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, #fff); flex: none; }
.s1 .ico.lg { width: 34px; height: 34px; border-radius: 11px; font-size: 18px; }

.s1 .s { font-size: 12.5px; line-height: 1.35; color: var(--ink2); }

/* ---------- B · Quotidien ---------- */
.s1 .now { padding: 15px 16px 16px; }

.s1 .segs { display: flex; gap: 5px; margin: 12px 0 13px; }

.s1 .btns { display: grid; grid-template-columns: 1fr 148px; gap: 10px; }

.s1 .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.s1 .app { text-align: center; }
.s1 .app .ic { width: 54px; height: 54px; border-radius: 17px; background: var(--surface); box-shadow: 0 1px 2px rgba(11,18,32,.06), 0 4px 12px rgba(11,18,32,.06); display: grid; place-items: center; font-size: 24px; color: var(--c); margin: 0 auto 6px; }
.s1 .app b { display: block; font-size: 12px; font-weight: 650; }
.s1 .app span { display: block; font-size: 11.5px; line-height: 1.25; color: var(--ink2); margin-top: 1px; }
.s1 .B .ls { padding: 2px 16px; }
.s1 .B .rg { width: 34px; height: 34px; }
.s1 .B .sec { margin: 12px 2px 7px; }

.s1 .B .ls > .li { min-height: 52px; padding: 5px 0; }

/* ---------- C · Éditoriale ---------- */
.s1 .C .title { font-size: 40px; letter-spacing: -.03em; }

.s1 .trio b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.s1 .trio b em { font-style: normal; font-size: 19px; font-weight: 700; color: var(--ink2); letter-spacing: 0; }

.s1 .C .hc .ch b { font-size: 14px; }

.s1 .D .title { font-size: 28px; }
.s1 .cells { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; margin-top: 12px; }
.s1 .cell { height: 66px; padding: 9px 11px 9px 12px; border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(11,18,32,.05), 0 3px 10px rgba(11,18,32,.04); display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; column-gap: 8px; }
.s1 .cell .lb { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; color: var(--ink2); grid-column: 1 / -1; }
.s1 .cell .lb i { font-size: 14px; color: var(--c); }
.s1 .cell .v { align-self: end; font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; white-space: nowrap; }

.s1 .D .li b { font-size: 14px; }

.s1 .D .hd2 em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: 0; text-transform: none; }

.s1 .E .sec2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 16px 2px 7px; display: flex; justify-content: space-between; }

<body class="s1">
<main class="cb">
  <header class="cb-head"><div class="num">01</div><div><h1>Saphir · cinq accueils complets</h1><p>Une même journée, cinq façons de la montrer : Nutrition, Fitness, Finances, Planning et Habitudes cohabitent sur chaque écran. Une seule couleur d'action ; les couleurs de catégorie vont aux icônes et aux graphiques.</p></div><span class="badge">Maquette d'idée · données d'exemple</span></header>

  <div class="cb-grid">
