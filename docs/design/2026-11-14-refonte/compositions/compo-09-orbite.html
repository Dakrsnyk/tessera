<style>
/* ======================= 09 · ORBITE : jetons ======================= */
body.s9 { --board: #08071A; --bink: #F1EEFF; --bink2: #B3ADDA;
  --bg: #0D0B1A; --surface: #17142B; --ink: #F1EEFF; --ink2: #9A94C4; --rule: #2B2750; --primary: #6E50F5; --on-primary: #FFFFFF;
  --cy: #3FE0D0; --vi: #7C5CFF; --track: #332E5E; --grid: #2B2750; --tick: #4A4580; --go: #9A94C4; --on-c: #0D0B1A;
  --font: Inter, "Segoe UI", sans-serif; --ft: Bahnschrift, "Segoe UI", sans-serif; --frame: #2B2750; --edge-h: 0px; --sw: 1.7; --ring-cap: butt;
  --c-nut: #FFAD66; --c-fit: #FF7A90; --c-pla: #7FA2FF; --c-hab: #8FE3A0; --c-bud: #E6D27A; --c-pro: #B9B3E8; --c-pas: #5CD0E8;
  --c-prot: #FF7A90; --c-gluc: #E6D27A; --c-lip: #6FA0FF;
  --ev-travail: #B49CFF; --ev-rdv: #F0A0FF; --ev-fill: 20%; --ev-r: 2px; --ev-bar: 2px; --wk-now: var(--cy); --wk-today: rgba(63,224,208,.05);
  --meter-h: 4px; --meter-r: 0px; --bar-r: 2px; --bar-past: .5;
  --lg-r: 16px; --lg-bg: #17142B; --lg-rule: #2B2750; }

.s9 .lg-p, .s9 .lg-key, .s9 .lg-row .w { color: #B3ADDA; }
.s9 .lg-row li { color: #F1EEFF; }
.s9 .cb-head h1 { font-family: var(--ft); font-weight: 300; letter-spacing: .2em; text-transform: uppercase; font-size: 34px; }
.s9 .cb-head .num { font-family: var(--ft); font-weight: 300; color: var(--cy); }
.s9 .cb-head .badge { border-color: #5A5590; color: #B3ADDA; }
.s9 .cb-cap em { color: #B3ADDA; }
.s9 .tag.e { background: #17382B; color: #8FE3A0; } .s9 .tag.a { background: #3A2D12; color: #FFC878; } .s9 .tag.d { background: #2A2160; color: #C9BCFF; }
.s9 .lg-h { font-family: var(--ft); font-weight: 300; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- composants Orbite ---------- */

.s9 .scr { padding: 0 20px; }

.s9 .ava { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--cy); display: grid; place-items: center; font: 300 16px var(--ft); color: var(--ink); }
.s9 .kick { margin-top: 0; }
.s9 .title { font-family: var(--ft); font-weight: 300; font-size: 30px; line-height: 1.15; letter-spacing: .2em; text-transform: uppercase; margin-top: 2px; }

.s9 .s { font-size: 12.5px; line-height: 1.35; color: var(--ink2); }
.s9 .big { font-family: var(--ft); font-weight: 300; font-size: 36px; line-height: 1.02; font-variant-numeric: tabular-nums; }
.s9 .big small { font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--ink2); }
.s9 .h3 { font-size: 17px; font-weight: 500; letter-spacing: -.005em; }
.s9 .btnP, .s9 .btnS { height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 12px var(--ft); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; padding: 0 14px; }

/* règle graduée : le trait plein monte jusqu'à la valeur */
.s9 .ru { position: relative; height: 14px; background:

  repeating-linear-gradient(90deg, #6A64A0 0 1px, transparent 1px 40px) bottom / 100% 12px no-repeat; }
.s9 .ru::before { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: var(--p); background: var(--c); }

.s9 .mac { display: grid; gap: 6px; }

.s9 .mac .cap { color: var(--ink); font-size: 11px; letter-spacing: .14em; }
.s9 .mac em { font-style: normal; font: 300 17px var(--ft); font-variant-numeric: tabular-nums; }
.s9 .mac em small { font: 400 11.5px var(--font); color: var(--ink2); }
.s9 .mac .ru { grid-column: 1 / -1; }

.s9 .u-hab i { --sw: 3; }
.s9 .u-dots { --dot: 18px; }
.s9 .u-bars .b > i { border-radius: 2px 2px 0 0; }
.s9 .u-spark .l { stroke-width: 1.5; } .s9 .u-spark .a { opacity: 0; } .s9 .u-spark .d { fill: var(--surface); }
/* barre d'onglets : étiquettes en capitales, repère cyan au trait */
.s9 .tabbar { background: var(--bg); border-top: 1px solid var(--rule); }
.s9 .ti { height: 56px; position: relative; font: 600 11px var(--ft); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); padding-top: 9px; gap: 4px; }
.s9 .ti i { --sw: 1.7; }
.s9 .ti.on { color: var(--cy); }
.s9 .ti.on::before { content: ""; position: absolute; top: -1px; width: 24px; height: 2px; background: var(--cy); }
.s9 .hi { background: #F1EEFF; }
/* lignes de liste */
.s9 .ls > .li { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--rule); }
.s9 .ls > .li:first-child { border-top: 0; }

.s9 .li .r small { font: 400 12px var(--font); color: var(--ink2); }
.s9 .chk { width: 22px; height: 22px; flex: none; color: var(--ink2); font-size: 22px; }
.s9 .chk.ok { color: var(--cy); }
.s9 .li.done b { text-decoration: line-through; color: var(--ink2); font-weight: 400; }
/* anneau en 4 segments (séries) + graduations extérieures : posé par le script de ce fichier */
.s9 .seg4 { display: block; width: 100%; height: 100%; }
.s9 .seg4 circle { fill: none; stroke-linecap: butt; }
.s9 .seg4 .t { stroke: var(--track); }
.s9 .seg4 .v { stroke: var(--c); }
.s9 .seg4 .k { stroke: var(--tick); }
/* orbes (rangée « Mes mini-apps ») */
.s9 .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.s9 .app { text-align: center; }
.s9 .app .rgw { width: 52px; height: 52px; margin: 0 auto 6px; }
.s9 .app .rgw .in i { font-size: 22px; color: var(--c); }
.s9 .app .cap { display: block; color: var(--ink); font-size: 11px; letter-spacing: .1em; }
.s9 .app span.s { display: block; font-size: 11.5px; line-height: 1.25; margin-top: 3px; }

/* ---------- A · Équilibrée ---------- */
.s9 .nutA { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; margin: 4px 0 12px; }

.s9 .A .wkA .u-week > span:first-child { display: none; }
.s9 .u-week .hd { font-family: var(--ft); font-weight: 600; }

/* ---------- B · Quotidien ---------- */

.s9 .now .m { font: 300 26px var(--ft); font-variant-numeric: tabular-nums; margin-top: 4px; }
.s9 .now .m small { font: 400 13px var(--font); color: var(--ink2); }
.s9 .btns { display: grid; grid-template-columns: 1fr 138px; gap: 10px; }
.s9 .btns .btnP { height: 48px; border-radius: 24px; }
.s9 .rest { height: 48px; border-radius: 24px; border: 1px solid var(--rule); display: flex; align-items: center; gap: 6px; padding-left: 16px; }
.s9 .rest .cap { display: block; font-size: 11px; letter-spacing: .14em; }

.s9 .B .sec { margin: 14px 0 8px; }
.s9 .ins { display: grid; grid-template-columns: auto 1fr auto; align-items: end; column-gap: 12px; row-gap: 1px; }
.s9 .ins .cap { color: var(--ink); }

/* ---------- C · Éditoriale ---------- */
.s9 .C .title { font-size: 34px; letter-spacing: .16em; }

.s9 .trio b { display: block; font: 300 42px/1 var(--ft); letter-spacing: 0; margin: 8px 0 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.s9 .trio b em { font-style: normal; font-size: 22px; color: var(--ink2); }
.s9 .trio span.s { display: block; font-size: 12px; line-height: 1.25; }
.s9 .wkC { --wk-h: 168px; --wk-gutter: 20px; --wk-head: 20px; --ev-fs: 11px; margin-top: 6px; }
.s9 .C .bb { height: 56px; --bars-gap: 4px; margin-top: 8px; }

.s9 .D .title { font-size: 26px; letter-spacing: .18em; }

.s9 .cell { height: 70px; padding: 9px 11px 9px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; column-gap: 8px; }

.s9 .D .hd2 .cap { color: var(--ink); }

.s9 .tm { width: 52px; font: 300 19px var(--ft); font-variant-numeric: tabular-nums; flex: none; color: var(--ink); }

.s9 .dom .m { font: 300 30px var(--ft); font-variant-numeric: tabular-nums; margin-top: 8px; }

.s9 .E .hc .big { font-size: 44px; margin-top: 8px; }
.s9 .E .sec2 { margin: 10px 2px 2px; }
.s9 .E .sec2 .cap { color: var(--ink); }
.s9 .band { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }

          </div>

      <div class="g2">

// anneau en 4 segments (séries) avec graduations extérieures : data-seg4="segments pleins, fraction du segment suivant"
document.querySelectorAll('[data-seg4]').forEach((svg) => { const [full, part] = svg.dataset.seg4.split(',').map(Number), r = 41, C = 2 * Math.PI * r, q = C / 4, gap = 7, d = q - gap;
  const rot = (k) => -90 + k * 90 + (gap / 2) / C * 360; let h = '<circle class="k" cx="50" cy="50" r="48" stroke-width="3" stroke-dasharray="1 3.02"/>';

  for (let k = 0; k < 4; k++) { const f = k < full ? 1 : (k === full ? part : 0); if (f > 0) h += `<circle class="v" cx="50" cy="50" r="${r}" stroke-width="6" stroke-dasharray="${(d * f).toFixed(1)} ${(C - d * f).toFixed(1)}" transform="rotate(${rot(k).toFixed(1)} 50 50)"/>`; }
